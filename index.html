<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飛機設計填表精靈</title>
<style>
:root{
  --paper:#f3e9d2; --paper2:#ece0c3; --card:#faf4e4; --ink:#33302a;
  --ink2:#6b6353; --line:#d8c9a5; --accent:#b65c2e; --accent2:#8f4a26;
  --ok:#3f7d3f; --warn:#a8731d; --bad:#a83a2a; --blue:#3a5a78;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17.5px}
body{
  font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(rgba(182,92,46,.045) 1px, transparent 1.4px),
    linear-gradient(180deg,#f5ecd7 0%,#f0e4c8 100%);
  background-size:26px 26px,100% 100%;
  line-height:1.65;padding:1.2rem .9rem 4rem;
}
.wrap{max-width:46rem;margin:0 auto}
header.hero{
  border:2px solid var(--ink);border-radius:.6rem;background:var(--card);
  padding:1.1rem 1.2rem;margin-bottom:1.1rem;position:relative;overflow:hidden;
  box-shadow:.25rem .25rem 0 rgba(51,48,42,.18);
}
header.hero::after{
  content:"NYCU UAV";position:absolute;right:-.4rem;top:-.9rem;
  font:700 3.6rem/1 Consolas,monospace;color:rgba(182,92,46,.10);
  letter-spacing:-.05em;pointer-events:none;
}
h1{font-size:1.45rem;letter-spacing:.08em}
.sub{color:var(--ink2);font-size:.92rem;margin-top:.25rem}
/* 進度列 */
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.steps button{
  flex:1 1 auto;min-width:5.2rem;border:1.5px solid var(--ink);border-radius:.45rem;
  background:var(--card);padding:.35rem .4rem;font:inherit;font-size:.82rem;
  cursor:pointer;color:var(--ink2);transition:all .15s;
}
.steps button.cur{background:var(--accent);color:#fff;border-color:var(--accent2);
  box-shadow:.15rem .15rem 0 rgba(51,48,42,.25);transform:translateY(-1px)}
.steps button.done{color:var(--ok);border-color:var(--ok)}
.fchips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .8rem}
.fchip{border:1.5px solid var(--line);border-radius:2rem;background:var(--card);
  padding:.22rem .8rem;font:inherit;font-size:.85rem;color:var(--ink2);cursor:pointer}
.fchip small{opacity:.65}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent2);font-weight:700}
.fgroup{font-weight:700;color:var(--ink2);font-size:.88rem;margin:.7rem 0 .35rem;
  border-bottom:1.5px dashed var(--line);padding-bottom:.15rem}
.lz{width:100%;max-height:340px;display:block;background:#f7f2e4;border:1.5px solid var(--line);
  border-radius:.5rem;margin:.2rem 0 .6rem}
.lz-fus{fill:#d8cba8;stroke:var(--ink2);stroke-width:2}
.lz-wing{fill:#e8b98a;stroke:var(--accent2);stroke-width:2;fill-opacity:.85}
.lz-tail{fill:#cfd9e4;stroke:#5b7891;stroke-width:2;fill-opacity:.9}
.lz-fin{fill:#8fa3b5;stroke:#4a6478;stroke-width:1.5}
.lz-dim{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 4}
.lz-lb{font-size:15px;fill:var(--ink2);text-anchor:middle;font-family:inherit}
.lz-cg circle{fill:#fff;stroke:#b3382e;stroke-width:2.5}
.lz-cg path{fill:#b3382e}
.lz-cg text{fill:#b3382e;font-weight:700;font-size:15px;text-anchor:middle}
.lz-np{fill:#3a6ea5}
.lz-npt{fill:#3a6ea5;font-weight:700}
#layoutViz{cursor:zoom-in}
.lzoom{position:fixed;inset:0;background:rgba(40,35,25,.82);z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.2rem;cursor:zoom-out}
.lzoom svg.lz{width:min(96vw,1500px);height:auto;max-height:88vh;margin:0}
/* 卡片 */
.card{
  background:var(--card);border:2px solid var(--ink);border-radius:.6rem;
  padding:1.1rem 1.2rem 1.3rem;margin-bottom:1rem;
  box-shadow:.25rem .25rem 0 rgba(51,48,42,.18);
}
.card h2{font-size:1.15rem;margin-bottom:.2rem;display:flex;align-items:baseline;gap:.5rem}
.card h2 .no{font:700 1rem Consolas,monospace;color:var(--accent);letter-spacing:.05em}
.lead{color:var(--ink2);font-size:.92rem;margin-bottom:.9rem}
/* 全流程地圖 */
.flowmap{display:flex;gap:.3rem;margin:0 0 1rem;font-size:.8rem;flex-wrap:wrap}
.flowmap div{
  flex:1 1 8rem;border:1.5px solid var(--line);border-radius:.4rem;
  background:#fffdf6;padding:.35rem .5rem;color:var(--ink2);
}
.flowmap div.now{border-color:var(--accent);background:#fdf3e4;color:var(--ink);font-weight:700}
.flowmap div b{display:block;font-size:.86rem}
/* 每步的「目標 / 看什麼」 */
.goal{
  border-left:4px solid var(--accent);background:#fdf6e9;border-radius:.35rem;
  padding:.45rem .75rem;margin:0 0 .8rem;font-size:.92rem;font-weight:700;
}
.goal .g2{color:var(--ink2);font-weight:400}
.goal .g2 b{color:var(--ok)}
/* 四張圖 */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.7rem;margin:.8rem 0}
.chart{border:1.5px solid var(--line);border-radius:.5rem;background:#fffdf6;padding:.5rem}
.chart h4{font-size:.9rem;margin-bottom:.15rem}
.chart .cv{font-size:.78rem;color:var(--ink2);min-height:2.2em}
.chart svg{width:100%;height:auto;display:block}
.chart .ok{color:var(--ok);font-weight:700}
.chart .bad{color:var(--bad);font-weight:700}
.flowbox{grid-column:1/-1}
.flowbox svg{width:100%;height:auto;display:block;background:#f4efe2;border-radius:.4rem}
.flowdash{fill:none;stroke:rgba(255,253,246,.5);stroke-width:1.3;stroke-dasharray:4 7;
  animation:flowdash .5s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-11}}
.flowbody{fill:#574931;stroke:#33302a;stroke-width:1.2}
.flowarr{stroke:#33302a;stroke-width:2.2}
.flowarrh{fill:#33302a}
.flowtxt{font-size:11px;fill:#6b6353;text-anchor:middle;font-family:inherit}
.flowstag{fill:#b3382e;stroke:#fff;stroke-width:1}
.flowscale{stroke:#6b6353;stroke-width:2}
.flowbox input[type=range]{width:12rem;vertical-align:middle}
.projbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.3rem 0 .5rem;
  font-size:1rem;color:var(--ink2)}
.projbar b{color:var(--ink)}
#projPanel{border:1.5px solid var(--line);border-radius:.6rem;background:#fffdf6;
  padding:.8rem;margin-bottom:.7rem}
#projPanel h3{margin:.2rem 0 .4rem;font-size:1.1rem}
#projPanel input[type=text]{font-size:1rem}
.pmodal{position:fixed;inset:0;background:rgba(40,35,25,.6);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:1rem}
.pmodal-card{background:var(--card);border:2px solid var(--ink);border-radius:.7rem;
  padding:1.2rem 1.4rem;max-width:26rem;width:100%;box-shadow:.3rem .3rem 0 rgba(51,48,42,.3)}
.pmodal-card h3{color:var(--bad);margin-bottom:.5rem}
.pmodal-card p{margin:.3rem 0;color:var(--ink2)}
.pmodal-card input{width:100%;padding:.45rem .6rem;border:2px solid var(--bad);
  border-radius:.45rem;font:inherit;letter-spacing:.15em;margin-top:.3rem}
#projPanel table{width:100%;border-collapse:collapse;font-size:.98rem}
#projPanel td,#projPanel th{padding:.4rem .55rem;border-bottom:1px solid var(--line);text-align:left}
#projPanel tr.sel{background:#f6efdd}
#projPanel input[type=text]{padding:.3rem .5rem;border:1.5px solid var(--line);border-radius:.4rem}
.runbox{border:2px solid var(--blue);border-radius:.55rem;background:#eef2f6;
  padding:.8rem 1rem;margin:.8rem 0}
.runbox h3{color:var(--blue);font-size:1.02rem;margin-bottom:.3rem}
.spin{display:inline-block;width:.9em;height:.9em;border:2px solid var(--blue);
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-.1em;margin-right:.4rem}
@keyframes sp{to{transform:rotate(360deg)}}
/* 紅黃燈自救表 */
details.fixit{border:1.5px dashed var(--bad);border-radius:.5rem;padding:.55rem .8rem;
  margin:.7rem 0;background:#fdf0ee}
details.fixit summary{cursor:pointer;font-weight:700;color:var(--bad)}
details.fixit table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
details.fixit td{border-bottom:1px solid #e8d5d0;padding:.3rem .25rem;vertical-align:top}
details.fixit td:first-child{white-space:nowrap;font-weight:700;color:var(--ink)}
/* 欄位 */
.field{margin-bottom:.9rem}
.field label{display:block;font-weight:700;font-size:.95rem;margin-bottom:.15rem}
.field .hint{font-size:.83rem;color:var(--ink2);margin-top:.2rem}
.field input[type=number],.field input[type=text],.field select{
  width:100%;max-width:14rem;font:inherit;font-size:1.05rem;padding:.35rem .55rem;
  border:1.5px solid var(--ink);border-radius:.4rem;background:#fffdf6;color:var(--ink);
}
.field input:focus,.field select:focus{outline:3px solid rgba(182,92,46,.35)}
.unit{font-size:.9rem;color:var(--ink2);margin-left:.35rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.2rem .9rem}
/* 徽章即時回饋 */
.badges{display:flex;flex-wrap:wrap;gap:.45rem;margin:.7rem 0 .2rem}
.badge{
  border:1.5px solid var(--line);border-radius:.45rem;background:#fffdf6;
  padding:.3rem .6rem;font-size:.85rem;box-shadow:.12rem .12rem 0 rgba(51,48,42,.08);
}
.badge b{font-family:Consolas,monospace;font-size:1rem}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
/* 機型卡 */
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem;margin:.4rem 0 .6rem}
.preset{
  border:2px solid var(--line);border-radius:.55rem;background:#fffdf6;padding:.7rem .8rem;
  cursor:pointer;transition:all .15s;
}
.preset:hover{transform:translateY(-2px)}
.preset.sel{border-color:var(--accent);background:#fdf3e4;box-shadow:.2rem .2rem 0 rgba(182,92,46,.3)}
.preset h3{font-size:1rem}
.preset.dis{opacity:.45;pointer-events:auto;cursor:not-allowed}
.preset p{font-size:.8rem;color:var(--ink2);margin-top:.2rem}
/* 翼型卡 */
.foilcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.6rem;margin:.4rem 0}
.foil{border:2px solid var(--line);border-radius:.55rem;background:#fffdf6;padding:.6rem .75rem;cursor:pointer}
.foil.sel{border-color:var(--blue);background:#eef2f6;box-shadow:.2rem .2rem 0 rgba(58,90,120,.3)}
.foil h4{font-size:.98rem;font-family:Consolas,monospace}
.foil p{font-size:.8rem;color:var(--ink2)}
.foil .tag{display:inline-block;font-size:.72rem;border:1px solid var(--ok);color:var(--ok);
  border-radius:.3rem;padding:0 .3rem;margin-top:.25rem}
.foil .tag.dl{border-color:var(--warn);color:var(--warn)}
details.teach{border:1.5px dashed var(--accent);border-radius:.5rem;padding:.6rem .8rem;margin:.7rem 0;background:#fdf6e9}
details.teach summary{cursor:pointer;font-weight:700;color:var(--accent2)}
details.teach ol{padding-left:1.3rem;margin-top:.4rem;font-size:.9rem}
details.teach li{margin-bottom:.3rem}
/* 導覽按鈕 */
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:.6rem}
.btn{
  font:inherit;font-weight:700;font-size:1.02rem;padding:.5rem 1.3rem;cursor:pointer;
  border:2px solid var(--ink);border-radius:.5rem;background:var(--card);color:var(--ink);
  box-shadow:.2rem .2rem 0 rgba(51,48,42,.25);transition:all .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px);box-shadow:.05rem .05rem 0 rgba(51,48,42,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#fff}
.btn.big{font-size:1.15rem;padding:.7rem 1.6rem;width:100%}
/* 總檢查表 */
table.check{width:100%;border-collapse:collapse;font-size:.9rem;margin:.5rem 0}
table.check td{border-bottom:1px solid var(--line);padding:.4rem .3rem;vertical-align:top}
table.check td:nth-child(2){font-family:Consolas,monospace;white-space:nowrap;text-align:right}
td.v-ok{color:var(--ok);font-weight:700}
td.v-warn{color:var(--warn);font-weight:700}
td.v-bad{color:var(--bad);font-weight:700}
.fusion-steps{border:2px solid var(--blue);border-radius:.55rem;background:#eef2f6;padding: .9rem 1rem;margin-top:1rem}
.fusion-steps h3{color:var(--blue);font-size:1.05rem}
.fusion-steps ol{padding-left:1.3rem;margin-top:.4rem;font-size:.92rem}
.fusion-steps li{margin-bottom:.35rem}
code{font-family:Consolas,monospace;background:#efe6cd;border-radius:.25rem;padding:0 .3rem;font-size:.88em}
.hidden{display:none}
@media (max-width:480px){ html{font-size:16.5px} .card{padding:.9rem .8rem 1rem} }
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>✈️ 飛機設計填表精靈</h1>
  <div class="sub">填表 → 產出設計表 → Fusion 一鍵長出機翼。<b>綠✓＝好飛區間</b>，⚠＝想清楚再過。</div>
</header>

<div class="flowmap" id="flowmap"></div>
<div class="projbar" id="projBar"></div>
<div id="projPanel" class="hidden"></div>
<div class="steps" id="stepbar"></div>
<div id="stepHost"></div>

<div class="nav">
  <button class="btn" id="btnPrev">← 上一步</button>
  <button class="btn primary" id="btnNext">下一步 →</button>
</div>
</div>

<!-- ======================= 純邏輯區（node 可獨立測試，勿放 DOM 碼） ======================= -->
<script id="core-logic">
"use strict";
/* ---------- 航模翼型小百科（AIRFOILS 分頁資料源） ---------- */
const FOILS = [

  note:"Drela 設計的滑翔翼型，薄而低阻，repo 已附檔",
  url:"http://airfoiltools.com/airfoil/details?airfoil=ag35-il"},
 {name:"NACA 2412", dat:"", have:true, cls:["sport","trainer"],
  clmax:1.25, aoaStall:13, clCruise:0.7, aoaCruise:4,
  note:"半對稱萬用翼型；NACA 四位數免下載（程式內建公式）",
  url:"http://airfoiltools.com/airfoil/details?airfoil=naca2412-il"},
 {name:"NACA 0012", dat:"", have:true, cls:["sport"],
  clmax:1.1, aoaStall:13, clCruise:0.5, aoaCruise:4,
  note:"對稱翼型，正倒飛一樣；特技取向。免下載",
  url:"http://airfoiltools.com/airfoil/details?airfoil=naca0012-il"},
 {name:"S1223", dat:"s1223.dat", have:false, cls:["lift"],
  clmax:1.85, aoaStall:10, clCruise:1.2, aoaCruise:5,
  note:"超高升力（載重挑戰用）；阻力大、需下載 .dat",
  url:"http://airfoiltools.com/airfoil/details?airfoil=s1223-il"},
];
const TAIL_FOIL = {name:"NACA 0008", dat:""};
// 翼型庫：正式來源是 repo 的 foils.json（GitHub 上人人可 PR 擴充）；
// 上面的 FOILS 只是 fetch 不到時的內建後備（file:// 開啟、離線）。
let LIB_FOILS = FOILS;
function setFoilLibrary(list){ if(Array.isArray(list)&&list.length) LIB_FOILS=list; }
function allFoils(custom){ return LIB_FOILS.concat(custom||[]); }

/* ---------- 機型預設 ---------- */
const PRESETS = {
 trainer:{label:"練習機", desc:"新生首選：慢、穩、摔得起",
  d:{mtow:700, v:12, chord:220, span:1200, taper:0.7, dihedral:5, washout:1,
     incidence:2, tegap:0, gap:60, foil:"Clark Y", noseC:1.25, tailC:2.5, xcg:0.35,
     shr:0.15, arh:4, th:0.6, svr:0.08, arv:1.5, tv:0.6, tailType:"cross",
     motorW:150, thrust:500, vtol:0, liftThrust:0, htailInc:0, htailDz:0}},

  d:{mtow:450, v:9, chord:200, span:1100, taper:0.8, dihedral:6, washout:1,
     incidence:2, tegap:0, gap:50, foil:"Clark Y", noseC:1.25, tailC:2.3, xcg:0.33,
     shr:0.18, arh:4, th:0.7, svr:0.09, arv:1.5, tv:0.6, tailType:"cross",
     motorW:100, thrust:350, vtol:0, liftThrust:0, htailInc:0, htailDz:0}},

  d:{mtow:1100, v:16, chord:240, span:1300, taper:0.65, dihedral:3, washout:1,
     incidence:1.5, tegap:0, gap:70, foil:"NACA 2412", noseC:1.3, tailC:2.6, xcg:0.33,
     shr:0.16, arh:4, th:0.6, svr:0.08, arv:1.6, tv:0.6, tailType:"cross",
     motorW:300, thrust:1000, vtol:0, liftThrust:0, htailInc:0, htailDz:0}},
 glider:{label:"電動滑翔機", desc:"追熱氣流、慢慢飄",
  d:{mtow:800, v:9, chord:180, span:2000, taper:0.6, dihedral:4, washout:1.5,
     incidence:2, tegap:0, gap:50, foil:"SD7037", noseC:1.2, tailC:2.8, xcg:0.36,
     shr:0.12, arh:4.5, th:0.6, svr:0.07, arv:1.6, tv:0.6, tailType:"vee",
     motorW:200, thrust:600, vtol:0, liftThrust:0, htailInc:0, htailDz:0}},
 vtolq:{label:"四旋翼定翼機", desc:"垂直起降＋定翼巡航（quad plane）",
  d:{mtow:2200, v:15, chord:250, span:1600, taper:0.7, dihedral:3, washout:1,
     incidence:2, tegap:0, gap:80, foil:"Clark Y", noseC:1.2, tailC:2.5, xcg:0.33,
     shr:0.16, arh:4, th:0.6, svr:0.09, arv:1.5, tv:0.6, tailType:"cross",
     motorW:400, thrust:1400, vtol:4, liftThrust:1100, htailInc:0, htailDz:0}},
 tilt:{label:"傾轉旋翼機", desc:"前傾轉×2＋尾×1，巡航效率較好但機構複雜",
  d:{mtow:1600, v:16, chord:230, span:1500, taper:0.7, dihedral:3, washout:1,
     incidence:2, tegap:0, gap:70, foil:"Clark Y", noseC:1.25, tailC:2.5, xcg:0.33,
     shr:0.16, arh:4, th:0.6, svr:0.09, arv:1.5, tv:0.6, tailType:"cross",
     motorW:350, thrust:1100, vtol:3, liftThrust:900, htailInc:0, htailDz:0}},
};

/* 構型層（QGC Airframe 的邏輯）：先選構型、再選起始值模板。
   純旋翼機不收——這是「機翼設計」精靈，沒有翼的東西這裡幫不上忙。 */
const AIRFRAMES = {
 plane:{label:"傳統固定翼", icon:"✈️", desc:"主翼＋尾翼，最好飛、最好修、新生首選",
        presets:["trainer","park","sport"]},
 glider:{label:"滑翔機", icon:"🪁", desc:"大展弦比、V 尾，追熱氣流慢慢飄",
        presets:["glider"]},
 vtolq:{label:"四旋翼定翼機", icon:"🛫", desc:"VTOL：四顆垂起馬達，起降不用跑道",
        presets:["vtolq"]},
 tilt:{label:"傾轉旋翼機", icon:"🛰️", desc:"VTOL：馬達會轉向，巡航沒有死重",
        presets:["tilt"]},
};

/* ---------- 全部公式（與 xlsx CALC 分頁同一套；SI 內部計算） ---------- */
function compute(i){
  const g=9.80665, rho=1.225, mu=1.81e-5;
  const W=i.mtow/1000, V=i.v, cr=i.chord, t=i.taper;
  const o={};
  o.ct = cr*t;
  o.mac = (2/3)*cr*(1+t+t*t)/(1+t);
  o.avg = cr*(1+t)/2;
  o.halfspan = (i.span - i.gap)/2;
  o.bproj = i.span/1000*Math.cos(i.dihedral*Math.PI/180);
  o.S = o.avg/1000*o.bproj;
  o.AR = o.bproj*o.bproj/o.S;
  o.wl = W/o.S*10;                                   // g/dm²
  o.wcl = (W*35.27396)/Math.pow(o.S*10.76391,1.5);
  o.clreq = W*g/(0.5*rho*V*V*o.S);
  const f = i.foilData;
  o.vs = Math.sqrt(2*W*g/(rho*o.S*f.clmax));
  o.vto = 1.2*o.vs; o.vapp = 1.3*o.vs;
  o.margin = V/o.vs;
  o.re = rho*V*(o.mac/1000)/mu;
  // ---- 尾翼幾何（依構型） ----
  const T = i.tailType || "cross";
  o.tailType = T;
  // 傳統參數（cross/tee/hh/box；也是切到 vee 時自動換算的來源）
  o.sh = i.shr*o.S; o.bh = Math.sqrt(i.arh*o.sh);
  o.chAvg = o.sh/o.bh*1000;
  o.chRoot = o.chAvg*2/(1+i.th); o.chTip = o.chRoot*i.th;
  o.sv = i.svr*o.S;
  o.finCount = (T==="hh"||T==="box") ? 2 : 1;
  const svEach = o.sv/o.finCount;
  o.bv = Math.sqrt(i.arv*svEach);                 // 單片 fin 高度 m
  o.cvAvg = svEach/o.bv*1000;
  o.cvRoot = o.cvAvg*2/(1+i.tv); o.cvTip = o.cvRoot*i.tv;
  if(T==="vee"){
    const th = (i.veeAngle||35)*Math.PI/180;
    o.veeCt = i.veeCr*i.veeTaper;
    const panel = (i.veeCr+o.veeCt)/2*i.veeL/1e6;  // 單片斜面積 m²
    o.veeArea = 2*panel;
    o.shEff = o.veeArea*Math.cos(th)*Math.cos(th); // cos² 有效面積（NACA R-823）
    o.svEff = o.veeArea*Math.sin(th)*Math.sin(th);
    o.veeSpanY = i.veeL*Math.cos(th);              // 站位展向（投影）
    o.tailAvgC = (i.veeCr+o.veeCt)/2;
    o.arhEff = Math.pow(2*i.veeL/1000,2)/o.veeArea; // 展開面 AR（給 XNP 式）
  } else {
    o.shEff = o.sh; o.svEff = o.sv;
    o.tailAvgC = o.chAvg; o.arhEff = i.arh;
  }
  // 力臂（重心→尾翼 1/4 弦；vee 用 V 尾自己的平均弦）
  o.lh = o.mac*(1-i.xcg) + i.tailC*o.mac - 0.75*(T==="vee"?o.tailAvgC:o.chAvg);
  o.lv = o.mac*(1-i.xcg) + i.tailC*o.mac - 0.75*(T==="vee"?o.tailAvgC:o.cvAvg);
  o.vh = o.shEff*(o.lh/1000)/(o.S*o.mac/1000);
  o.vv = o.svEff*(o.lv/1000)/(o.S*o.bproj);
  // 穩定性（xflr5 實測 XNP 優先；沒填用 MIT 公式估）
  o.xnpEst = 0.25 + (1+2/o.AR)/(1+2/o.arhEff)*(1-4/(o.AR+2))*o.vh;
  o.xnpFromXflr5 = i.xnpX>0;
  o.xnp = o.xnpFromXflr5 ? i.xnpX : o.xnpEst;
  o.sm = o.xnp - i.xcg;
  o.B = (o.lv/1000/o.bproj)*i.dihedral/o.clreq;
  o.vvb = o.vv*o.B;
  // 由傳統尾換算 vee 的建議值（切換構型時自動填入）
  o.veeSuggestAngle = Math.atan(Math.sqrt(o.sv/o.sh))*180/Math.PI;
  const veeAreaSug = (o.sh+o.sv)*1.075;
  o.veeSuggestL = Math.sqrt(veeAreaSug*i.arh)/2*1000;
  o.veeSuggestCr = (veeAreaSug/2)/(o.veeSuggestL/1000)*1000*2/(1+i.th);
  // 佈局位置（>0 的覆寫值優先，0=自動）
  o.noseLE = i.noseC*o.avg;
  o.totalLen = (i.noseC+i.tailC)*o.avg + cr;
  const autoHt = i.xcg*o.mac + o.lh - 0.25*(T==="vee"?o.tailAvgC:o.chAvg);
  const autoFin = i.xcg*o.mac + o.lv - 0.25*(T==="vee"?o.tailAvgC:o.cvAvg);
  o.htailLeX = (i.htailX>0) ? i.htailX : autoHt;
  o.finLeX = (i.finX>0) ? i.finX : autoFin;
  // T 尾自動墊到 fin 頂；htailDz 是使用者指定的「相對主翼平面高度」（可負）
  o.htailZ = ((T==="tee") ? o.bv*1000 : 0) + (i.htailDz||0);
  o.finY = (T==="hh"||T==="box") ? o.bh*1000/2 : 0;   // 雙垂尾在平尾兩端
  o.boxTopZ = o.bv*1000;
  // 動力
  o.wkg = i.motorW>0 ? i.motorW/W : 0;
  o.tr = i.thrust>0 ? i.thrust/1000/W : 0;
  return o;
}

/* ---------- 檢核（回傳 [等級, 訊息]；等級 ok/warn/bad） ---------- */
function checks(i,o){
  const c=[];
  // 疑似打錯的輸入（單位/少打一個 0）——比紅燈更早點名病因
  const typo=[];
  if(i.chord<60) typo.push(`根弦 ${i.chord}mm 比麥克筆還窄（常見 150~300mm，是不是少打 0？）`);
  if(i.chord>700) typo.push(`根弦 ${i.chord}mm 快跟門一樣寬（是不是多打 0？）`);
  if(i.span<300) typo.push(`翼展 ${i.span}mm 只有一個手掌大`);
  if(i.span>0&&i.chord>0&&i.span<i.chord*1.5) typo.push("翼展比根弦還短——單位是不是填反了？");
  if(i.mtow<80) typo.push(`重量 ${i.mtow}g 比手機還輕（單位是公克）`);
  if(i.mtow>20000) typo.push(`重量 ${i.mtow}g 超過 20kg`);
  if(i.v<4||i.v>60) typo.push(`巡航速度 ${i.v} m/s 超出常理（單位是 m/s，不是 km/h）`);
  if(typo.length) c.push(["bad","輸入檢查","⚠", typo.join("；")]);
  const rng=(v,lo,hi,name,why)=> c.push(
    v>=lo&&v<=hi ? ["ok",name,fmt(v),"落在建議 "+lo+"~"+hi]
                 : ["warn",name,fmt(v),"建議 "+lo+"~"+hi+"："+why]);
  rng(o.AR,4.5,7.5,"展弦比","太低滑翔差、太高翼樑要夠強（滑翔機 8~25 另計）");
  const wclCat = o.wcl<3?"室內機":o.wcl<5?"後院機/電滑翔":o.wcl<7?"公園機/教練機"
    :o.wcl<10?"運動機":o.wcl<14?"進階運動/像真":o.wcl<17?"專家像真/EDF":"重型";
  c.push([o.wcl<10?"ok":"warn","WCL 立方翼載",fmt(o.wcl),"分級："+wclCat+"（新生建議 ≤7）"]);
  c.push([o.clreq<=i.foilData.clCruise?"ok":"bad","巡航需求 CL",fmt(o.clreq,3),
    o.clreq<=i.foilData.clCruise?"翼型巡航 CL "+i.foilData.clCruise+" 夠用"
    :"超過翼型巡航 CL "+i.foilData.clCruise+"——加大機翼、減重或飛快一點"]);
  c.push(!isFinite(o.margin)
    ? ["bad","巡航速度餘裕 V/Vs","—","重量或機翼面積是 0，算不出失速速度——先把上面的欄位填齊"]
    : [o.margin>=1.3?"ok":"bad","巡航速度餘裕 V/Vs",fmt(o.margin),
       o.margin>=1.3?"離失速夠遠（≥1.3）":"太貼近失速速度！加大機翼或減重"]);
  c.push([o.re>=100000?"ok":o.re>=50000?"warn":"bad","巡航雷諾數",Math.round(o.re).toLocaleString(),
    o.re>=100000?"翼型正常工作區":o.re>=50000?"過渡帶：務必用低雷諾數翼型（SD7037 系）":"低於臨界帶（4~5萬）：翼弦太短或飛太慢，CLmax 會崩"]);
  if(o.lh<=30||o.lv<=30){
    c.push(["bad","尾力臂",fmt(Math.min(o.lh,o.lv),0)+" mm",
      "力臂太短甚至為負——「主翼後緣→尾翼後緣」距離太小、或尾翼弦太大，"
      +"回佈局那步把尾距加大"]);
  }
  rng(o.vh,0.30,0.60,"Vh 水平尾容積","太小俯仰飄、太大尾巴重"+
    (o.tailType==="vee"?"（V 尾以 cos² 有效面積換算）":""));
  rng(o.vv,0.02,0.05,"Vv 垂直尾容積","太小會擺尾（荷蘭滾）、太大盤旋不穩"+
    (o.tailType==="vee"?"（V 尾以 sin² 有效面積換算）":""));
  rng(o.sm,0.05,0.15,"靜穩定裕度 SM",
    (o.xnpFromXflr5?"（XNP 用 xflr5 實測值）":"（XNP 用公式估算，建議跑 xflr5 精算）")+
    "<0.05 神經質難飛；>0.20 遲鈍、抬頭配平重");
  c.push([o.B>=5?"ok":o.B>=3?"warn":"bad","B 螺旋穩定",fmt(o.B),
    o.B>=5?"放手自穩":o.B>=3?"副翼機可接受（3~5）":"螺旋不穩：加上反角"]);
  if(o.tailType!=="vee") c.push([o.vvb>=0.10&&o.vvb<=0.20?"ok":"warn","Vv·B 舵轉權威",fmt(o.vvb,3),
    "只對無副翼機重要；0.10 勉強、0.20 很有力"]);
  if(i.motorW>0){
    const p = o.wkg<110?["bad","恐飛不動（<50W/lb）"]:o.wkg<155?["ok","慢速/滑翔夠用"]
      :o.wkg<200?["ok","練習機級"]:o.wkg<245?["ok","運動機級"]:["ok","特技/3D 級"];
    c.push([p[0],"功率負載",Math.round(o.wkg)+" W/kg",p[1]]);
  }
  if(i.thrust>0){
    const p = o.tr<0.4?["bad","爬升吃力"]:o.tr<0.6?["warn","滑翔/慢速夠用"]
      :o.tr<0.8?["ok","教練/運動 OK"]:o.tr<1.1?["ok","很有勁"]:["ok","垂直性能級"];
    c.push([p[0],"靜推重比",fmt(o.tr),p[1]]);
  }
  {
    // 裝置角差（decalage）＝主翼裝置角 − 尾翼裝置角。要正的（尾翼迎角較小）
    // 縱向才穩得順：朱寶鎏《模型飛機飛行原理》建議 1~3°。
    const dec = i.incidence - (i.htailInc||0);
    const p = dec<0?["bad","尾翼裝置角比主翼大——配平會打架，把尾翼調小"]
      :dec<1?["warn","偏小，配平範圍窄"]:dec<=3.5?["ok","教科書區間"]
      :["warn","偏大，高速時低頭力矩重"];
    c.push([p[0],"裝置角差（主翼−尾翼）",fmt(dec,1)+"°",p[1]]);
  }
  if(i.vtol>0 && i.liftThrust>0){
    // PX4 官方建議懸停推重比至少 1.5:1、舒適 2:1（quadplane 同標準）
    const hov = i.vtol*i.liftThrust/i.mtow;
    const p = hov<1.5?["bad","起飛勉強、抗風差——加大垂起動力或減重"]
      :hov<1.8?["warn","能飛，風大會吃力"]:["ok","懸停餘裕充足"];
    c.push([p[0],"懸停推重比",fmt(hov)+"（"+i.vtol+"顆垂起）",p[1]]);
  }
  return c;
}
function fmt(v,d){ return Number(v).toFixed(d===undefined?2:d); }

/* ---------- xlsx 產生（store-only zip；EXPORT 契約與 WingForge 解析器對齊） ---------- */
function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cellXml(ref,v){
  if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
}
function colName(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
function sheetXml(rows){
  // rows: array of array（null 跳格）
  let body="";
  rows.forEach((row,ri)=>{
    if(!row){return}
    let cellsX="";
    row.forEach((v,ci)=>{ if(v!==null&&v!==undefined) cellsX+=cellXml(colName(ci+1)+(ri+1),v); });
    if(cellsX) body+=`<row r="${ri+1}">${cellsX}</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
    `<sheetData>${body}</sheetData></worksheet>`;
}
function buildWorkbook(sheets){ // sheets: [{name, rows}]
  const files={};
  files["[Content_Types].xml"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
   `<Default Extension="xml" ContentType="application/xml"/>`+
   `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
   `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
   sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+
   `</Types>`;
  files["_rels/.rels"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
   `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  files["xl/workbook.xml"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" `+
   `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`+
   sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+
   `</sheets></workbook>`;
  files["xl/_rels/workbook.xml.rels"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
   sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+
   `</Relationships>`;
  sheets.forEach((s,i)=>{ files[`xl/worksheets/sheet${i+1}.xml`]=sheetXml(s.rows); });
  return files;
}
/* store-only zip */
const _CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  const names=Object.keys(files);
  for(const name of names){
    const data=enc.encode(files[name]); const nameB=enc.encode(name);
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    off+=30+nameB.length+data.length;
  }
  let cdSize=0; central.forEach(p=>cdSize+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,names.length,true);eo.setUint16(10,names.length,true);
  eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  const total=off+cdSize+22;const out=new Uint8Array(total);let p=0;
  for(const part of [...parts,...central,new Uint8Array(eo.buffer)]){out.set(part,p);p+=part.length}
  return out;
}

/* ---------- 由輸入組出整本 xlsx（EXPORT 契約） ---------- */
function buildXlsxBytes(i,o,fileName){
  const T = i.tailType || "cross";
  const HDR = ["idx","span_mm","chord_mm","twist_deg","sweep_mm","dihedral_deg"];
  const exportRows=[
    ["EXPORT_VERSION",2,null,"由填表精靈產生（值已算好，非公式）"],
    ["design.name",fileName],
    ["wing.airfoil",i.foilData.name],
    ["wing.mirror","TRUE"],
    ["wing.te_gap_mm",i.tegap],
    ["wing.center_gap_mm",i.gap],
    ["wing.twist_pivot",0.25],
    ["wing.smooth","FALSE"],
    ["wing.tip_round","FALSE"],
    ["tail.type",T],
    ["tail.airfoil",TAIL_FOIL.name],
  ];
  if(T==="vee"){
    exportRows.push(["vee.le_x_mm",o.htailLeX]);
  }else{
    exportRows.push(
      ["htail.le_x_mm",o.htailLeX],["htail.z_mm",o.htailZ],["htail.incidence_deg",i.htailInc||0],
      ["fin.count",o.finCount],["fin.le_x_mm",o.finLeX],
      ["fin.y_mm",o.finY],["fin.z_mm",0]);
    if(T==="box") exportRows.push(
      ["boxtop.le_x_mm",o.finLeX+0.25*(o.cvRoot-o.cvTip)],
      ["boxtop.z_mm",o.boxTopZ]);
  }
  exportRows.push(null,["STATIONS_MAIN"],HDR,
    [0,0,i.chord,i.incidence,0,0],
    [1,o.halfspan,o.ct,i.incidence-i.washout,0.25*(i.chord-o.ct),i.dihedral]);
  if(T==="vee"){
    exportRows.push(null,["STATIONS_VEE"],HDR,
      [0,0,i.veeCr,0,0,0],
      [1,o.veeSpanY,o.veeCt,0,0.25*(i.veeCr-o.veeCt),i.veeAngle]);
  }else{
    exportRows.push(null,["STATIONS_HTAIL"],HDR,
      [0,0,o.chRoot,0,0,0],
      [1,o.bh*1000/2,o.chTip,0,0.25*(o.chRoot-o.chTip),0]);
    exportRows.push(null,["STATIONS_FIN"],HDR,
      [0,0,o.cvRoot,0,0,0],
      [1,o.bv*1000,o.cvTip,0,0.25*(o.cvRoot-o.cvTip),0]);
    if(T==="box") exportRows.push(null,["STATIONS_BOXTOP"],HDR,
      [0,0,o.cvTip,0,0,0],
      [1,o.bh*1000/2,o.cvTip,0,0,0]);
  }
  const airfoilRows=[
    ["翼型庫對照（.dat 放 wingforge/airfoils/）"],
    ["翼型名稱","dat 檔名","來源連結","備註"],
    ...allFoils(i.customFoils).map(f=>[f.name,f.dat,f.url||"",f.note||""]),
    [TAIL_FOIL.name,"","","尾翼用；NACA 四位數免 dat"],
  ];
  const inputRows=[
    ["填表精靈輸入紀錄（值）"],["項目","值","單位"],
    ["機型",PRESETS[i.preset].label,""],["最大起飛重量",i.mtow,"g"],
    ["巡航速度",i.v,"m/s"],["根弦長",i.chord,"mm"],["翼展",i.span,"mm"],
    ["漸縮比",i.taper,""],["上反角",i.dihedral,"deg"],["洗出",i.washout,"deg"],
    ["裝置角",i.incidence,"deg"],["後緣厚度",i.tegap,"mm"],["機身寬",i.gap,"mm"],
    ["主翼翼型",i.foilData.name,""],["CLmax",i.foilData.clmax,""],
    ["巡航CL",i.foilData.clCruise,""],
    ["機頭距離",i.noseC,"chord"],["尾翼距離",i.tailC,"chord"],["重心位置",i.xcg,"MAC比"],
    ["平尾面積比",i.shr,""],["平尾AR",i.arh,""],["垂尾面積比",i.svr,""],
    ["垂尾AR",i.arv,""],["尾翼構型",i.tailType,""],
    ["XNP(xflr5實測,0=未跑)",i.xnpX,"MAC比"],
    ["馬達功率",i.motorW,"W"],["靜推力",i.thrust,"g"],
  ];
  const calcRows=[["計算結果紀錄（值）"],["項目","值","判定"],
    ...checks(i,o).map(c=>[c[1],c[2],(c[0]==="ok"?"✓ ":"⚠ ")+c[3]])];
  const files=buildWorkbook([
    {name:"EXPORT",rows:exportRows},
    {name:"AIRFOILS",rows:airfoilRows},
    {name:"INPUT",rows:inputRows},
    {name:"CALC",rows:calcRows},
  ]);
  return makeZip(files);
}
/* ---------- xflr5 飛機定義 XML（Plane > Import Plane(s) from xml file(s)） ---------- */
function buildXflr5Xml(i,o,name){
  const T=i.tailType||"cross";
  const E=xmlEsc, M=v=>(v/1000).toFixed(6);   // mm→m
  const sec=(y,chord,xoff,dihe,twist,foil)=>`
    <Section>
     <y_position>${M(y)}</y_position>
     <Chord>${M(chord)}</Chord>
     <xOffset>${M(xoff)}</xOffset>
     <Dihedral>${dihe.toFixed(2)}</Dihedral>
     <Twist>${twist.toFixed(2)}</Twist>
     <x_number_of_panels>13</x_number_of_panels>
     <x_panel_distribution>COSINE</x_panel_distribution>
     <y_number_of_panels>19</y_number_of_panels>
     <y_panel_distribution>UNIFORM</y_panel_distribution>
     <Left_Side_FoilName>${E(foil)}</Left_Side_FoilName>
     <Right_Side_FoilName>${E(foil)}</Right_Side_FoilName>
    </Section>`;
  const wing=(wname,type,pos,isFin,sections)=>`
   <wing>
    <Name>${E(wname)}</Name>
    <Type>${type}</Type>
    <Position>${pos.map(v=>(v/1000).toFixed(6)).join(", ")}</Position>
    <Tilt_angle>0.000</Tilt_angle>
    <Symetric>${isFin?"false":"true"}</Symetric>
    <isFin>${isFin?"true":"false"}</isFin>
    <isDoubleFin>false</isDoubleFin>
    <isSymFin>false</isSymFin>
    <Inertia><Volume_Mass>0.000</Volume_Mass></Inertia>
    <Sections>${sections}</Sections>
   </wing>`;
  const foil=i.foilData.name;
  // 主翼：2 站位；xflr5 的 Dihedral 是「本段」屬性→掛在起始剖面，
  // 末剖面的 Dihedral 被忽略（官方 wing.cpp 語意），慣例填 0。
  // 展向用 span/2（自中線起算的完整梯形）而非扣機身的翼段半展——
  // VLM 慣例把機身段升力視為連續，這也是精靈算 S/AR/Vh 的口徑，
  // 兩邊一致 xflr5 才是在驗證「同一台飛機」。
  const mainSecs =
    sec(0, i.chord, 0, i.dihedral, i.incidence, foil)+
    sec(i.span/2, o.ct, 0.25*(i.chord-o.ct), 0, i.incidence-i.washout, foil);
  let tailWings="";
  const tInc=i.htailInc||0, tDz=i.htailDz||0;
  if(T==="vee"){
    tailWings = wing("V-Tail","ELEVATOR",[o.htailLeX,0,tDz],false,
      sec(0, i.veeCr, 0, i.veeAngle, tInc, TAIL_FOIL.name)+
      sec(o.veeSpanY, o.veeCt, 0.25*(i.veeCr-o.veeCt), 0, tInc, TAIL_FOIL.name));
  }else{
    tailWings = wing("Elevator","ELEVATOR",[o.htailLeX,0,o.htailZ],false,
      sec(0, o.chRoot, 0, 0, tInc, TAIL_FOIL.name)+
      sec(o.bh*1000/2, o.chTip, 0.25*(o.chRoot-o.chTip), 0, tInc, TAIL_FOIL.name));
    // hh/box 在 xflr5 以「等效單垂尾」近似：兩片各 Sv/2、同弦長 →
    // 高度加倍即得總面積 Sv 的單片（Vv 等效，橫航向穩定性量級一致）。
    tailWings += wing("Fin","FIN",[o.finLeX,0,0],true,
      sec(0, o.cvRoot, 0, 0, 0, TAIL_FOIL.name)+
      sec(o.bv*1000*((T==="hh"||T==="box")?2:1), o.cvTip,
          0.25*(o.cvRoot-o.cvTip), 0, 0, TAIL_FOIL.name));
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE explane>
<explane version="1.0">
 <Units>
  <length_unit_to_meter>1</length_unit_to_meter>
  <mass_unit_to_kg>1</mass_unit_to_kg>
 </Units>
 <Plane>
  <Name>${E(name)}</Name>
  <Description>由 NYCU UAV 填表精靈產生</Description>
  <Inertia>
   <Point_Mass>
    <Tag>全機質量</Tag>
    <Mass>${(i.mtow/1000).toFixed(4)}</Mass>
    <coordinates>${(i.xcg*o.mac/1000).toFixed(6)}, 0, 0</coordinates>
   </Point_Mass>
  </Inertia>
  <has_body>false</has_body>${wing("Main Wing","MAINWING",[0,0,0],false,mainSecs)}${tailWings}
 </Plane>
</explane>
`;
}

/* ---------- flow5 飛機 XML（Plane > import plane from xml） ----------
   flow5 是 xflr5 的第 7 版（同作者），2026 起 GPL-3.0 開源免費。
   格式對照官方樣本 API_examples/PlaneRun4/xml/plane.xml 逐標籤確認：
   - 根元素 <xflplane version="1.0">、DOCTYPE flow5（xflr5 是 explane）
   - Units 多了 area / speed / inertia 三個換算係數
   - wing 層：symmetric（xflr5 是少一個 m 的 Symetric）、多了 Two_Sided /
     Tip_Strips / Rx_angle / Ry_angle（Ry_angle 取代 xflr5 的 Tilt_angle）
   - 垂尾不再用 isFin 隱式旋轉，改為 Type=FIN + Rx_angle=-90 + Two_Sided=false
   - <Section> 的所有標籤與 xflr5 完全相同，故剖面產生邏輯直接沿用
   全案優點：flow5 的腳本模式支援整機分析（xflr5 只支援翼型），
   所以之後可以由 Fusion 外掛直接驅動、免手動點四個步驟。            */
/* ---------- 中立幾何描述：VLM 求解器與 flow5 XML 都吃同一份 ----------
   同一份資料餵兩邊，瀏覽器算的跟 flow5 算的才保證是同一台飛機。
   單位 mm；座標 x 往後、y 往右、z 往上（xflr5/flow5 慣例）。 */
function buildPlaneGeom(i,o){
  const T=i.tailType||"cross";
  const S=(y,chord,xOffset,dihedral,twist,foil)=>({y,chord,xOffset,dihedral,twist,foil});
  const foil=i.foilData.name;
  const wings=[{name:"Main Wing",type:"MAINWING",position:[0,0,0],sections:[
    S(0,i.chord,0,i.dihedral,i.incidence,foil),
    S(i.span/2,o.ct,0.25*(i.chord-o.ct),0,i.incidence-i.washout,foil)]}];
  const ti=i.htailInc||0, tz=i.htailDz||0;
  if(T==="vee"){
    wings.push({name:"V-Tail",type:"ELEVATOR",position:[o.htailLeX,0,tz],sections:[
      S(0,i.veeCr,0,i.veeAngle,ti,TAIL_FOIL.name),
      S(o.veeSpanY,o.veeCt,0.25*(i.veeCr-o.veeCt),0,ti,TAIL_FOIL.name)]});
  }else{
    wings.push({name:"Elevator",type:"ELEVATOR",position:[o.htailLeX,0,o.htailZ],sections:[
      S(0,o.chRoot,0,0,ti,TAIL_FOIL.name),
      S(o.bh*1000/2,o.chTip,0.25*(o.chRoot-o.chTip),0,ti,TAIL_FOIL.name)]});
    // hh/box 以等效單垂尾近似：兩片各 Sv/2、同弦長，高度加倍即等面積
    wings.push({name:"Fin",type:"FIN",position:[o.finLeX,0,0],sections:[
      S(0,o.cvRoot,0,0,0,TAIL_FOIL.name),
      S(o.bv*1000*((T==="hh"||T==="box")?2:1),o.cvTip,
        0.25*(o.cvRoot-o.cvTip),0,0,TAIL_FOIL.name)]});
  }
  return {wings};
}

function buildFlow5Xml(i,o,name){
  const E=xmlEsc, M=v=>(v/1000).toFixed(6);   // mm→m
  const sec=st=>`
     <Section>
      <y_position>${M(st.y)}</y_position>
      <Chord>${M(st.chord)}</Chord>
      <xOffset>${M(st.xOffset)}</xOffset>
      <Dihedral>${st.dihedral.toFixed(3)}</Dihedral>
      <Twist>${st.twist.toFixed(3)}</Twist>
      <x_number_of_panels>13</x_number_of_panels>
      <x_panel_distribution>COSINE</x_panel_distribution>
      <y_number_of_panels>19</y_number_of_panels>
      <y_panel_distribution>UNIFORM</y_panel_distribution>
      <Left_Side_FoilName>${E(st.foil)}</Left_Side_FoilName>
      <Right_Side_FoilName>${E(st.foil)}</Right_Side_FoilName>
     </Section>`;
  // isFin 在 flow5 改用 Rx_angle=-90 立起來；Two_Sided=false 代表單面
  const wing=w=>{const isFin=w.type==="FIN";return `
    <wing>
     <Name>${E(w.name)}</Name>
     <Type>${w.type}</Type>
     <Description></Description>
     <Position>${w.position.map(v=>(v/1000).toFixed(6)).join(", ")}</Position>
     <Tip_Strips>1</Tip_Strips>
     <Rx_angle>${isFin?"-90.000":"0.000"}</Rx_angle>
     <Ry_angle>0.000</Ry_angle>
     <symmetric>true</symmetric>
     <Two_Sided>${isFin?"false":"true"}</Two_Sided>
     <Inertia><Mass>0.000</Mass></Inertia>
     <Sections>${w.sections.map(sec).join("")}</Sections>
    </wing>`;};
  const g=buildPlaneGeom(i,o);
  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE flow5>
<xflplane version="1.0">
 <Units>
  <length_unit_to_meter>1</length_unit_to_meter>
  <area_unit_to_m2>1</area_unit_to_m2>
  <mass_unit_to_kg>1</mass_unit_to_kg>
  <speed_unit_to_ms>1</speed_unit_to_ms>
  <inertia_unit_to_kgm2>1</inertia_unit_to_kgm2>
 </Units>
 <Plane>
  <Name>${E(name)}</Name>
  <Description>由 NYCU UAV 填表精靈產生</Description>
  <Inertia>
   <Point_Mass>
    <Tag>全機質量</Tag>
    <Mass>${(i.mtow/1000).toFixed(4)}</Mass>
    <coordinates>${(i.xcg*o.mac/1000).toFixed(6)}, 0, 0</coordinates>
   </Point_Mass>
  </Inertia>${g.wings.map(wing).join("")}
 </Plane>
</xflplane>
`;
}

/* ---------- xflr5 分析定義 XML（Analysis > Import analysis from xml file） ----------
   格式依 xflr5 v6 官方原始碼（xmlwpolarwriter/reader.cpp、miarex.cpp、
   wpolardlg.cpp）查證，避開三個已知 reader bug：
   1. Use_Plane_Inertia=true —— 繞過 <CoG> 分隔符不一致（writer 寫空白、
      reader 用逗號 split）與 CoG_Ixz 讀取的 dead code；質量/重心/慣性矩
      全部由 plane XML 的 <Inertia> 算出。
   2. VLM2 要寫 Method=PANELMETHOD + Thin_Surfaces=true + Use_VLM1=false，
      不是 VLMMETHOD（那是現行 GUI 不再產生的 legacy enum）。
   3. Reference_Dimensions 寫 PROJECTEDREFDIM 讓 xflr5 自己從幾何重算參考
      尺寸（非 MANUALREFDIM 時 XML 裡的值本來就會被覆寫）。
   Plane_Name 對不上時 xflr5 會自動掛到當前飛機，所以先匯入 plane 再匯入
   analysis 一定接得上。α 掃描範圍不在此 XML（原始碼層級不存在該欄位）。 */
function buildXflr5AnalysisXml(i,o,planeName){
  const E=xmlEsc, f=(v,d)=>Number(v).toFixed(d===undefined?5:d);
  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE Plane_Polar>
<Plane_Polar version="1.0">
    <Units>
        <length_unit_to_meter>1</length_unit_to_meter>
        <area_unit_to_m2>1</area_unit_to_m2>
        <mass_unit_to_kg>1</mass_unit_to_kg>
        <speed_unit_to_ms>1</speed_unit_to_ms>
        <inertia_unit_to_kgm2>1</inertia_unit_to_kgm2>
    </Units>
    <Polar>
        <Polar_Name>T1-${f(i.v,1)}ms-VLM2</Polar_Name>
        <Plane_Name>${E(planeName)}</Plane_Name>
        <Type>FIXEDSPEEDPOLAR</Type>
        <Method>PANELMETHOD</Method>
        <Use_VLM1>false</Use_VLM1>
        <Thin_Surfaces>true</Thin_Surfaces>
        <Viscous_Analysis>true</Viscous_Analysis>
        <Ignore_Body_Panels>true</Ignore_Body_Panels>
        <Tilted_Analysis>false</Tilted_Analysis>
        <Ground_Effect>false</Ground_Effect>
        <Ground_Height>0.00000</Ground_Height>
        <Viscosity>1.5e-05</Viscosity>
        <Density>1.22500</Density>
        <Fixed_Velocity>${f(i.v)}</Fixed_Velocity>
        <Fixed_AOA>0.00000</Fixed_AOA>
        <Fixed_Bank_Angle>0.00000</Fixed_Bank_Angle>
        <Fixed_SideSlip>0.00000</Fixed_SideSlip>
        <Reference_Dimensions>PROJECTEDREFDIM</Reference_Dimensions>
        <Reference_Area>${f(o.S)}</Reference_Area>
        <Reference_Span_Length>${f(o.bproj)}</Reference_Span_Length>
        <Reference_Chord_Length>${f(o.mac/1000)}</Reference_Chord_Length>
        <Use_Plane_Inertia>true</Use_Plane_Inertia>
    </Polar>
</Plane_Polar>
`;
}

/* ---------- α 掃描範圍：不在 XML 裡，是 xflr5 的全域 GUI 狀態，
   存在 %APPDATA%\XFLR5.ini 的 [Miarex] 段。產一份片段讓使用者貼上，

function buildXflr5IniSnippet(){

}

function upd(key,val){ const n=parseFloat(val); if(isFinite(n)) state[key]=n; refreshLive(); }
function refreshLive(){
  document.querySelectorAll("[data-live]").forEach(el=>{
    el.innerHTML=liveBadges(JSON.parse(el.dataset.live));

  const rh=$("#runHost");
  if(rh){

      rr.innerHTML = renderCharts(LAST_RESULT) + (stale
        ? `<div class="hint">⚠ 上面是<b>之前的結果</b>——幾何／速度／重心後來改過了，按「分析」重跑才是現在這台。</div>`

  const ph=$("#posHint");
  if(ph){
    const o=compute(inputs());
    let t=`📐 主翼 MAC=<b>${o.mac.toFixed(0)}mm</b>，重心比例 ${state.xcg} → 重心在主翼前緣後 <b>${(state.xcg*o.mac).toFixed(0)}mm</b><br>📍 目前位置（主翼前緣=0）：平尾/V尾前緣 X≈<b>${o.htailLeX.toFixed(0)}mm</b>`;
    if(state.tailType!=="vee") t+=`、垂尾前緣 X≈<b>${o.finLeX.toFixed(0)}mm</b>`;
    if(Math.abs(o.htailZ)>0.01) t+=`、平尾/V尾高度 Z=${o.htailZ.toFixed(0)}mm${state.tailType==="tee"?"（T尾自動+自訂）":""}`;
    if(o.finY>0) t+=`、雙垂尾在 Y=±${o.finY.toFixed(0)}mm`;
    t+=`；機身總長估 ${o.totalLen.toFixed(0)}mm`;

function foilCat(f){
  if(f.cat) return f.cat;

  if(cls.includes("lift")) return "lift";

  return "misc";
}

/* 存進社團資料庫（Vercel/Neon）：立即全社團可用、免 GitHub 帳號。
   只有網址沒座標時 API 會伺服器端代抓 airfoiltools。 */
async function saveFoilToDb(btn){
  const sf = state._shareFoil;
  if(!sf) return;
  const f = state.customFoils.find(x=>x.name===sf.name) || {};
  const msg = $("#dbSaveMsg");
  btn.disabled = true; msg.textContent = "存檔中…";
  try{
    if(/^NACA\s*\d{4}$/i.test(f.name||"")){
      msg.textContent = "NACA 四位數是內建公式，不用存庫"; btn.disabled=false; return; }
    const body = { name: f.name, dat_name: f.dat || (f.name.replace(/[^\w.-]/g,"_")+".dat"),
      dat_text: (state._nfDatText||"").trim() || undefined,
      url: f.url || undefined, clmax: f.clmax, cl_cruise: f.clCruise,
      cat: f.cat || "misc", cls: f.cls || [] };
    const r = await fetch("/api/foils", { method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.hint || j.error);
    msg.innerHTML = "<b style='color:var(--ok)'>✅ 已進社團庫，所有人重新整理即可用（Fusion 也抓得到）</b>";
    btn.textContent = "💾 已存";
  }catch(e){
    btn.disabled = false;
    msg.innerHTML = "<span style='color:var(--bad)'>❌ "+String(e.message||e)+"</span>";
  }
}

function addFoil(){
  const name=($("#nf_name").value||"").trim();
  let dat=($("#nf_dat").value||"").trim();
  const clmax=parseFloat($("#nf_clmax").value), clc=parseFloat($("#nf_clc").value);
  if(!name){alert("翼型名稱必填");return}
  if(allFoils(state.customFoils).some(f=>f.name===name)){alert("這個名稱已存在");return}
  const isNaca=/^NACA\s*\d{4}$/i.test(name);
  const srcUrl=state._nfUrl||"";
  if(!isNaca && !dat && !srcUrl){
    alert("請三選一：貼 airfoiltools 網址、選 .dat 檔、或用 NACA 四位數命名");return}
  if(isNaca) dat="";
  const nf={name, dat, have:false, custom:true, cls:[], url:srcUrl,
    cat:($("#nf_cat")&&$("#nf_cat").value)||"misc",
    clmax:clmax||1.2, clCruise:clc||0.7,
    note:"自訂翼型"+(isNaca?"（NACA 內建公式）":
      srcUrl?"（機器人/Fusion 會自動下載）":`（需把 ${dat} 放進 airfoils/）`)};
  state.customFoils.push(nf);
  // 組「一鍵開 Issue 上傳」連結（機器人 workflow 會自動 commit）。
  // 表單有選 .dat 檔時直接把座標內容預填進 Issue（URL 太長才退回手貼）。
  const meta={name:nf.name, dat:nf.dat, clmax:nf.clmax, clCruise:nf.clCruise, cat:nf.cat};
  if(nf.url) meta.url=nf.url;
  const datText=(state._nfDatText||"").trim();
  const mkBody=(datPart)=>

    if(!embedded) issueUrl=mkUrl(mkBody(

      "（取代提示文字）：\n```dat\n（把 .dat 內容貼在這裡）\n```"));
  }
  state._shareFoil={name:nf.name, issueUrl, embedded,
    datText:(!embedded&&datText)?datText:null};
  state._nfDatText=null; state._nfUrl=null;

function parseFoilUrl(url){
  const msg=$("#nf_urlmsg");
  const m=(url||"").match(/airfoiltools\.com.*?airfoil=([\w.-]+)/i);
  if(!m){
    state._nfUrl=null;
    if((url||"").trim()) msg.innerHTML="⚠ 認不出來——網址要像 "+
      "<code>airfoiltools.com/airfoil/details?airfoil=<b>oa206-il</b></code>";
    return;
  }
  const id=m[1];
  state._nfUrl="http://airfoiltools.com/airfoil/details?airfoil="+id;
  if(!$("#nf_dat").value) $("#nf_dat").value=id.replace(/-il$/,"")+".dat";
  if(!$("#nf_name").value) $("#nf_name").value=id.replace(/-il$/,"").toUpperCase();
  msg.innerHTML="✅ 認出翼型代號 <code>"+id+"</code>——免下載，上傳時機器人會自動抓座標"+
    "（正式名稱也會依 .dat 檔頭校正）";
}
function readFoilFile(inp){
  const f=inp.files&&inp.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ state._nfDatText=r.result;
    const guess=f.name.toLowerCase().endsWith(".dat")?f.name.toLowerCase():f.name.toLowerCase()+".dat";
    if(!$("#nf_dat").value) $("#nf_dat").value=guess.replace(/[^\w.-]/g,"");
    // 檔頭常是翼型名稱，順手帶入名稱欄
    if(!$("#nf_name").value){
      const first=(r.result.split("\n")[0]||"").trim();
      if(first && !/^[-\d.\s]+$/.test(first)) $("#nf_name").value=first.slice(0,30);
    }
  };
  r.readAsText(f);
}
function delFoil(name){

function zoomLayout(){
  const i=inputs(), o=compute(i);
  const ov=document.createElement("div");
  ov.className="lzoom";
  ov.innerHTML=`<div class="hint" style="color:#f4efe2;text-align:center;margin-bottom:.4rem">點任意處或按 Esc 關閉</div>`+layoutSvg(i,o);
  ov.onclick=()=>ov.remove();
  const esc=e=>{ if(e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown",esc); } };
  document.addEventListener("keydown",esc);

function layoutSvg(i,o){
  const T=i.tailType||"cross";
  const xN=-o.noseLE, xT=xN+o.totalLen;              // 機頭 / 機尾 x（mm）
  const half=i.span/2;
  const swp=0.25*(i.chord-o.ct);                     // 1/4 弦打直的翼尖前緣位移
  const wing=`M0,0 L${swp},${-half} L${swp+o.ct},${-half} L${i.chord},0
              L${swp+o.ct},${half} L${swp},${half} Z`;
  let tail="";
  if(T==="vee"){
    const y=o.veeSpanY, sw=0.25*(i.veeCr-o.veeCt), x=o.htailLeX;
    tail=`<path class="lz-tail" d="M${x},0 L${x+sw},${-y} L${x+sw+o.veeCt},${-y} L${x+i.veeCr},0
      L${x+sw+o.veeCt},${y} L${x+sw},${y} Z"/>
      <text class="lz-lb" x="${x+i.veeCr/2}" y="${-y-10}">V 尾</text>`;
  }else{
    const y=o.bh*1000/2, sw=0.25*(o.chRoot-o.chTip), x=o.htailLeX;
    tail=`<path class="lz-tail" d="M${x},0 L${x+sw},${-y} L${x+sw+o.chTip},${-y} L${x+o.chRoot},0
      L${x+sw+o.chTip},${y} L${x+sw},${y} Z"/>`;
    const fy=o.finY||0, fx=o.finLeX, fw=o.cvRoot;
    const strip=yy=>`<rect class="lz-fin" x="${fx}" y="${yy-5}" width="${fw}" height="10" rx="4"/>`;
    tail+= fy>0 ? strip(-fy)+strip(fy) : strip(0);
  }
  const xcg=i.xcg*o.mac;
  const xnp=(state.xnpX>0?state.xnpX:o.xnpEst)*o.mac;
  const y0=-half-46, y1=half+44, x0=xN-30, x1=xT+30;
  return `<svg class="lz" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" preserveAspectRatio="xMidYMid meet">
    <rect class="lz-fus" x="${xN}" y="-9" width="${o.totalLen}" height="18" rx="9"/>
    <path class="lz-wing" d="${wing}"/>
    ${tail}
    <line class="lz-dim" x1="${xN}" y1="${half+28}" x2="${xT}" y2="${half+28}"/>
    <text class="lz-lb" x="${(xN+xT)/2}" y="${half+22}">全長 ≈ ${o.totalLen.toFixed(0)} mm（等比例俯視）</text>
    <g class="lz-cg" transform="translate(${xcg},0)">
      <circle r="9"/><path d="M0,-9 A9,9 0 0 1 9,0 L0,0 Z"/><path d="M0,9 A9,9 0 0 1 -9,0 L0,0 Z"/>
      <text y="-16" x="0">CG ${xcg.toFixed(0)}</text>
    </g>
    <g transform="translate(${xnp},0)">
      <path class="lz-np" d="M0,-8 L7,6 L-7,6 Z"/>
      <text class="lz-lb lz-npt" x="0" y="22">NP ${xnp.toFixed(0)}</text>
    </g>
  </svg>`;
}

          <li><b>Cl vs α</b>——確認「會飛」：α=0 時 Cl 要 &gt;0，並看清楚失速在幾度。</li>

          <li><b>Cl/Cd vs α</b>——檢查「效率」：升阻比峰值應落在上一步的配平攻角附近；

        </ol>

    <ol>
      <li><b>XNP 讀到了</b> → 填進下面的欄位（弦長比），SM 自動改用實測值。</li>
      <li><b>Cm vs α 的過零點不在巡航攻角附近</b>（例：巡航該在 4° 但 Cm=0 落在 8°）→
        回 <a href="javascript:go(2)">主翼</a> 步調 <b>裝置角</b>：過零攻角太大→裝置角加大、太小→減小，

      <li><b>SM 太大/太小</b> → 回 <a href="javascript:go(4)">機身佈局</a> 步<b>先動重心位置</b>

      <li><b>α=0 時 Cl≤0</b>（平飛要抬很大機頭）→ 裝置角太小或翼型太對稱，

      <li><b>Cl/Cd 峰值攻角離巡航攻角很遠</b> → 回 <a href="javascript:go(1)">重量速度</a> 步調巡航速度，

      <li><b>在 xflr5 挪過尾翼位置</b> → 把最終位置抄回 <a href="javascript:go(4)">機身佈局</a> 步的

async function api(path, body, method){
  const r = await fetch(path, body===undefined && !method ? {} : {
    method: method || "POST", headers:{"Content-Type":"application/json"},
    body: body===undefined ? undefined : JSON.stringify(body)});
  let j; try{ j = await r.json(); }catch(e){ j = {ok:false, error:"HTTP "+r.status}; }
  if(!j.ok) throw new Error(j.hint || j.error || ("HTTP "+r.status));
  return j;
}

/* 網頁本體永遠是同一份（GitHub Pages）；「分析服務」則是另外一支可有可無的
   小程式。這裡負責把它找出來，找不到就只是少了分析按鈕，其餘功能照常。
   找的順序：網址參數 ?api= → 上次記住的 → 開這頁的伺服器自己 → 本機預設埠 */
const API_DEFAULT = "http://127.0.0.1:8765";
let API_BASE = null, API_INFO = null;

function apiCandidates(){
  const out = [];
  const q = new URLSearchParams(location.search).get("api");
  if(q) out.push(q.replace(/\/$/, ""));
  const saved = localStorage.getItem("wf_api");
  if(saved) out.push(saved.replace(/\/$/, ""));
  if(location.protocol === "http:") out.push(location.origin);
  out.push(API_DEFAULT);
  return [...new Set(out)];
}

async function findServer(){
  for(const base of apiCandidates()){
    try{
      const c = new AbortController();
      const t = setTimeout(()=>c.abort(), 1500);
      const r = await fetch(base + "/api/ping", {signal: c.signal, cache: "no-store"});
      clearTimeout(t);
      if(!r.ok) continue;
      const j = await r.json();
      if(!j.ok) continue;
      API_BASE = base; API_INFO = j;
      localStorage.setItem("wf_api", base);
      return j;
    }catch(e){ /* 這個位址沒人在家，換下一個 */ }
  }
  API_BASE = null; API_INFO = null;
  return null;
}

    h += ` <button class="btn" onclick="doAnalyzeFlow5()">🔬 用 flow5 對拍</button>

  return h;
}


function chartSvg(pts, xk, yk, opts){
  const o = opts || {};
  const W = 260, H = 170, P = 34;
  const xs = pts.map(p=>p[xk]), ys = pts.map(p=>p[yk]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = v => P + (v - x0) / ((x1 - x0) || 1) * (W - P - 8);
  const py = v => H - P + 6 - (v - y0) / ((y1 - y0) || 1) * (H - P - 14);
  const d = pts.map((p,i)=>(i?"L":"M")+px(p[xk]).toFixed(1)+" "+py(p[yk]).toFixed(1)).join(" ");
  const zx = (x0 < 0 && x1 > 0) ? `<line x1="${px(0)}" y1="${py(y0)}" x2="${px(0)}" y2="${py(y1)}" stroke="#c9bb9a" stroke-dasharray="3 3"/>` : "";
  const zy = (y0 < 0 && y1 > 0) ? `<line x1="${px(x0)}" y1="${py(0)}" x2="${px(x1)}" y2="${py(0)}" stroke="#c9bb9a" stroke-dasharray="3 3"/>` : "";
  const mark = (o.markX !== undefined && o.markX !== null && o.markX >= x0 && o.markX <= x1)
    ? `<line x1="${px(o.markX)}" y1="${py(y0)}" x2="${px(o.markX)}" y2="${py(y1)}" stroke="#b65c2e" stroke-width="1.5"/>` : "";
  // 滑鼠十字游標要用的資料全塞進屬性：座標點 + 兩軸名稱 + 繪圖區映射
  const data = JSON.stringify(pts.map(p=>[+p[xk].toFixed(4), +p[yk].toFixed(5)]));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||''}"
    data-pts='${data}' data-xn="${o.xlab||xk}" data-yn="${yk}"
    data-map="${P},${x0},${x1},${y0},${y1}">
    <rect x="${P}" y="6" width="${W-P-8}" height="${H-P-8}" fill="#fffdf6" stroke="#d8c9a5"/>
    ${zx}${zy}${mark}
    <path d="${d}" fill="none" stroke="#3a5a78" stroke-width="1.8"/>
    <text x="${P}" y="${H-8}" font-size="9" fill="#6b6353">${x0.toFixed(1)}</text>
    <text x="${W-8}" y="${H-8}" font-size="9" fill="#6b6353" text-anchor="end">${x1.toFixed(1)}</text>
    <text x="4" y="14" font-size="9" fill="#6b6353">${y1.toFixed(2)}</text>
    <text x="4" y="${H-P+4}" font-size="9" fill="#6b6353">${y0.toFixed(2)}</text>
    <text x="${W/2}" y="${H-8}" font-size="9" fill="#6b6353" text-anchor="middle">${o.xlab||''}</text>
    <g class="hoverui" style="display:none;pointer-events:none">
      <line class="hx" stroke="#b65c2e" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line class="hy" stroke="#b65c2e" stroke-width="0.8" stroke-dasharray="2 2"/>
      <circle class="hc" r="3" fill="#b65c2e"/>
      <rect class="hb" fill="#fff8e8" stroke="#b65c2e" stroke-width="0.6" rx="3"/>
      <text class="ht" font-size="10" fill="#4a3d2a" font-weight="bold"></text>
    </g>
  </svg>`;
}

/* 十字游標：滑鼠移到圖上就吸附到最近的資料點，顯示精確 (x, y)。
   事件掛在 document 上做委派——圖是 innerHTML 生的，個別掛會漏。 */
(function(){
  function onMove(e){
    const svg = e.target.closest ? e.target.closest("svg[data-pts]") : null;
    document.querySelectorAll("svg[data-pts]").forEach(o=>{
      if(o!==svg) o.querySelector(".hoverui").style.display="none";
    });
    if(!svg) return;
    const pts = JSON.parse(svg.dataset.pts);
    const [P,x0,x1,y0,y1] = svg.dataset.map.split(",").map(Number);
    const W=260, H=170;
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX-rect.left)/rect.width*W;
    // 反算資料 x → 找最近點
    const dataX = x0 + (mx-P)/((W-P-8)||1)*(x1-x0);
    let bi=0, bd=Infinity;
    pts.forEach((p,i)=>{const d=Math.abs(p[0]-dataX); if(d<bd){bd=d;bi=i;}});
    const [dx,dy] = pts[bi];
    const px = P + (dx-x0)/((x1-x0)||1)*(W-P-8);
    const py = H-34+6 - (dy-y0)/((y1-y0)||1)*(H-34-14);
    const ui = svg.querySelector(".hoverui");
    ui.style.display="";
    const hx=ui.querySelector(".hx"), hy=ui.querySelector(".hy");
    hx.setAttribute("x1",px);hx.setAttribute("x2",px);hx.setAttribute("y1",6);hx.setAttribute("y2",H-28);
    hy.setAttribute("x1",P);hy.setAttribute("x2",W-8);hy.setAttribute("y1",py);hy.setAttribute("y2",py);
    const c=ui.querySelector(".hc");c.setAttribute("cx",px);c.setAttribute("cy",py);
    const t=ui.querySelector(".ht");
    t.textContent = `${svg.dataset.xn}=${dx}  ${svg.dataset.yn}=${dy}`;
    const tw = t.textContent.length*5.4+10;
    let tx = px+8; if(tx+tw>W-8) tx = px-8-tw;
    let ty = py-10; if(ty<16) ty = py+18;
    t.setAttribute("x",tx+5); t.setAttribute("y",ty+3);
    const b=ui.querySelector(".hb");
    b.setAttribute("x",tx);b.setAttribute("y",ty-9);b.setAttribute("width",tw);b.setAttribute("height",15);
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerdown", onMove);   // 手機點一下也能讀值
})();

function renderCharts(res){
  const v = res.verdict, p = res.points;
  const f = (n,d)=>Number(n).toFixed(d===undefined?2:d);
  const s = res.summary || {};
  const cards = [
    {t:"① Cm vs Cl — 自穩定？",
     svg: chartSvg(p, "CL", "Cm", {xlab:"CL"}),
     v: v.stable
        ? `<span class="ok">✅ 斜率 ${f(v.cm_cl_slope,4)} 為負 → 自穩定</span>`
        : `<span class="bad">❌ 斜率 ${f(v.cm_cl_slope,4)} 為正 → 不穩定，回 STEP 5 把重心往前移</span>`},
    {t:"② Cl vs α — 會飛？",
     svg: chartSvg(p, "alpha", "CL", {xlab:"α (°)", markX:0}),
     v: v.flies
        ? `<span class="ok">✅ α=0 時 CL = ${f(v.cl_at_zero,3)} > 0</span>`
        : `<span class="bad">❌ α=0 時 CL = ${f(v.cl_at_zero,3)} ≤ 0 → 加大裝置角或換翼型</span>`},
    {t:"③ Cm vs α — 配平點",
     svg: chartSvg(p, "alpha", "Cm", {xlab:"α (°)", markX:v.trim_alpha}),
     v: v.trim_alpha === null
        ? `<span class="bad">❌ 在掃描範圍內找不到 Cm=0，飛機配平不了</span>`
        : `配平攻角 <b>${f(v.trim_alpha)}°</b>（放手後它自己想飛的攻角）`},
    {t:"④ Cl/Cd vs α — 效率",
     svg: chartSvg(p, "alpha", "CLCD", {xlab:"α (°)", markX:v.best_ld_alpha}),
     v: `升阻比峰值 <b>${f(v.best_ld,1)}</b> @ ${f(v.best_ld_alpha,1)}°` +
        (v.trim_vs_best === null ? "" :
         (v.trim_vs_best <= 2
          ? ` — <span class="ok">與配平點只差 ${f(v.trim_vs_best,1)}°，很理想</span>`
          : ` — <span class="bad">與配平點差 ${f(v.trim_vs_best,1)}°</span>，飛機停在效率差的攻角，回 STEP 3 微調裝置角`))},
  ];
  const xnp = s.xnp_m !== undefined
    ? `<div class="hint" style="margin-top:.4rem">📐 ${s.method||"flow5"} 實算 <b>XNP = ${f(s.xnp_m,4)} m</b>` +
      (s.static_margin !== undefined ? `、靜穩定裕度 <b>${f(s.static_margin,1)}%</b>` : "") +
      `　<button class="btn" style="font-size:.8rem;padding:.1rem .6rem"
        onclick="applyXnp(${s.xnp_m})">↩ 填回上面的 XNP 欄位</button></div>`
    : "";
  const flow = (s.method||"").startsWith("VLM-JS") ? `
    <div class="chart flowbox"><h4>🌬 流場切面（對稱面 y=0）——由上面同一組渦格解直接積分，不是示意圖</h4>
      <svg id="flowSvg" viewBox="0 0 640 300"></svg>
      <div class="cv" style="margin-top:.35rem">攻角 α
        <input type="range" id="flowA" min="-5" max="15" step="any" value="2"
          oninput="drawFlow(Math.round(+this.value))">
        <label style="margin-left:.5rem;cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="flowCruise" onchange="flowCruiseToggle(this.checked)">
          🔒 巡航攻角</label>
        <span id="flowInfo"></span>
        <div style="margin-top:.2rem">翼前上洗、翼後下洗、尾翼泡在下洗流裡；打在翼面上的流線截止於駐點——
        拖滑桿看攻角怎麼改變整個流場。</div></div>
    </div>` : "";
  return `<div class="charts">${cards.map(c=>
    `<div class="chart"><h4>${c.t}</h4>${c.svg}<div class="cv">${c.v}</div></div>`).join("")}</div>${flow}${xnp}`;
}

/* ---------- 流場動畫：streamlines() 積分真實速度場，SVG 虛線位移做流動感 ---------- */
function drawFlow(alpha){
  const svg = $("#flowSvg");
  if(!svg || !LAST_MODEL) return;
  const key = "v2:" + alpha;
  if(!LAST_MODEL.cache[key])
    LAST_MODEL.cache[key] = VLM.streamlines(LAST_MODEL.model, alpha);
  const fl = LAST_MODEL.cache[key];
  const b = fl.box, W = 640, H = 300;
  const kx = W/(b.x1-b.x0), kz = H/(b.z1-b.z0), k = Math.min(kx,kz);
  const X = x=>(x-b.x0)*k + (W-(b.x1-b.x0)*k)/2;
  const Z = z=>H-((z-b.z0)*k + (H-(b.z1-b.z0)*k)/2);
  // 流速上色：|V|/V∞ 0.7（深藍）→1.0（灰藍）→1.5（橘紅），CFD 慣例
  const spdColor = r=>{
    const t = Math.max(0, Math.min(1, (r-0.7)/0.8));
    return `hsl(${220-190*t} ${45+30*t}% ${42+8*t}%)`;
  };
  let seg = "", dash = "", marks = "";
  fl.lines.forEach((ln,idx)=>{
    const pts = ln.pts;
    // 底層：分段流速上色（隔點取樣，DOM 減半）
    for(let j=2;j<pts.length;j+=2){
      const a=pts[j-2], c=pts[j];
      seg += `<line x1="${X(a[0]).toFixed(1)}" y1="${Z(a[1]).toFixed(1)}"
        x2="${X(c[0]).toFixed(1)}" y2="${Z(c[1]).toFixed(1)}"
        stroke="${spdColor((a[2]+c[2])/2)}"/>`;
    }
    // 面層：淡色虛線推進動畫（保留流動感）
    const d = pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Z(p[1]).toFixed(1)).join(" ");
    dash += `<path class="flowdash" style="animation-delay:-${(idx%5)*0.11}s" d="${d}"/>`;
    if(ln.stag){
      const e=pts[pts.length-1];
      marks += `<circle class="flowstag" cx="${X(e[0]).toFixed(1)}" cy="${Z(e[1]).toFixed(1)}" r="3.5"/>`;
    }
  });
  // 機身剖面
  let body = "";
  LAST_MODEL.model.profile.forEach(pr=>{
    const d = pr.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Z(p[1]).toFixed(1)).join(" ")
      + (pr.solid?" Z":"");
    body += pr.solid
      ? `<path class="flowbody" d="${d}"/>`
      : `<path class="flowbody" style="fill:none" d="${d}"/>`;
  });
  // 來流箭頭（方向＝攻角）＋比例尺 100mm ＋ 流速圖例
  const ar = 14, ax0 = 26, ay0 = 40;
  const arrow = `<g transform="translate(${ax0},${ay0}) rotate(${-alpha})">
      <line x1="-${ar}" y1="0" x2="${ar}" y2="0" class="flowarr"/>
      <path d="M${ar},0 L${ar-6},-4 L${ar-6},4 Z" class="flowarrh"/></g>
    <text class="flowtxt" x="${ax0}" y="${ay0+18}">V∞　α=${alpha}°</text>`;
  const sb = 0.1*k;
  const scale = `<line class="flowscale" x1="16" y1="${H-14}" x2="${16+sb}" y2="${H-14}"/>
    <text class="flowtxt" x="${16+sb/2}" y="${H-20}">100 mm</text>`;
  const legend = `<defs><linearGradient id="spdg" x1="0" x2="1">
      <stop offset="0" stop-color="${spdColor(0.7)}"/><stop offset=".38" stop-color="${spdColor(1.0)}"/>
      <stop offset="1" stop-color="${spdColor(1.5)}"/></linearGradient></defs>
    <rect x="${W-116}" y="${H-18}" width="72" height="6" rx="3" fill="url(#spdg)"/>
    <text class="flowtxt" x="${W-80}" y="${H-22}">流速 慢→快</text>`;
  svg.innerHTML = `<g stroke-width="1.4" stroke-linecap="round">${seg}</g>${dash}${body}${marks}${arrow}${scale}${legend}`;
  const pt = fl.point;
  $("#flowInfo").innerHTML =
    ` <b>α=${alpha}°</b>　CL=${pt.CL.toFixed(3)}　Cm=${pt.Cm.toFixed(4)}　L/D=${pt.CLCD.toFixed(1)}`;
  const fa = $("#flowA"); if(fa && +fa.value!==alpha) fa.value = alpha;
}

/* 巡航攻角＝平飛時 CL 恰好等於「巡航需求 CL」的攻角，從四張圖同一組
   資料點內插；找不到（需求 CL 超出掃描範圍）就退用配平攻角。
   ⚠ 這兩個函式曾被 drawFlow 區間重寫誤刪（splice 事故）——現在 CI 檢查
   會掃「HTML 引用的 handler 必有定義」，再被吃掉會直接紅燈。 */
function cruiseAlpha(){
  const i = inputs(), o = compute(i);
  const pts = (LAST_RESULT && LAST_RESULT.points) || [];
  for(let k = 0; k < pts.length - 1; k++){
    const a = pts[k], b = pts[k+1];
    if((a.CL - o.clreq) * (b.CL - o.clreq) <= 0 && a.CL !== b.CL){
      return { a: a.alpha + (b.alpha - a.alpha) * (o.clreq - a.CL) / (b.CL - a.CL),
               clreq: o.clreq, fallback: false };
    }
  }
  const t = LAST_RESULT && LAST_RESULT.verdict && LAST_RESULT.verdict.trim_alpha;
  return { a: (t === null || t === undefined) ? 2 : t, clreq: o.clreq, fallback: true };
}

function flowCruiseToggle(on){
  const fa = $("#flowA");
  if(on){
    const c = cruiseAlpha();
    fa.disabled = true;
    drawFlow(+c.a.toFixed(1));
    $("#flowInfo").innerHTML += c.fallback
      ? `　<span style="color:var(--bad)">（需求 CL 超出掃描範圍，改用配平攻角）</span>`
      : `　<b style="color:var(--ok)">＝巡航狀態（CL=需求 ${c.clreq.toFixed(3)}）</b>`;
  }else{
    fa.disabled = false;
  }
}

function initFlowPanel(){
  if(!$("#flowSvg") || !LAST_MODEL || !LAST_RESULT) return;
  if(LAST_MODEL.fp !== LAST_RESULT.fp) { $("#flowSvg").closest(".flowbox").style.display="none"; return; }
  const t = LAST_RESULT.verdict && LAST_RESULT.verdict.trim_alpha;
  drawFlow(t===null||t===undefined ? 2 : Math.max(-5, Math.min(15, Math.round(t))));
}

function applyXnp(xnpMeters){
  const o = compute(inputs());
  state.xnpX = +(xnpMeters * 1000 / o.mac).toFixed(3);   // m → MAC 比例
  render();
}

/* 這次分析對應哪一台飛機——切回 STEP 8 時用來判斷結果還新不新鮮 */
function analysisFingerprint(){
  const i = inputs(), o = compute(i);
  return JSON.stringify([buildPlaneGeom(i,o), i.v, i.xcg]);
}

/* ---------- 一鍵分析：瀏覽器內渦格法，按下去零點幾秒出四張圖 ----------
   實測與 flow5 對拍（教練機/Clark Y）：CL 差 2%、dCm/dCL 差 3%、配平角差
   0.15°、XNP 差 4.5% MAC——落在 flow5 自家不同方法之間的差異範圍內。 */
async function fetchFoilDat(dat){
  const tries=[
    "airfoils/"+dat,                                                        // 同源
    "https://uav-designsystem-web.vercel.app/airfoils/"+dat,               // Vercel 靜態
    "/api/foils?dat="+encodeURIComponent(dat),                              // 社團自建庫（DB）
    "https://cdn.jsdelivr.net/gh/NYCU-UAV/UAV_designsystem_web@main/airfoils/"+dat,
    "https://raw.githubusercontent.com/NYCU-UAV/UAV_designsystem_web/main/airfoils/"+dat,
  ];
  for(const u of tries){
    try{ const r=await fetch(u,{cache:"force-cache"}); if(r.ok) return await r.text(); }
    catch(e){ /* 換下一個來源 */ }
  }
  return null;   // 抓不到就退回 NACA 解析式或平板（solver 會記在 missing_foils）
}

async function doAnalyze(){
  const box = $("#runResult");
  const i = inputs(), o = compute(i);
  box.innerHTML = `<span class="spin"></span> 正在瀏覽器裡跑渦格法…`;
  await new Promise(r=>setTimeout(r,30));   // 讓轉圈圈先畫出來
  try{
    const foils = {};
    if(i.foilData.dat){
      const txt = await fetchFoilDat(i.foilData.dat);
      if(txt) foils[i.foilData.name] = txt;
    }
    const model = VLM.buildModel({
      geom: buildPlaneGeom(i, o), foils: foils,
      velocity: i.v, xcgM: i.xcg * o.mac / 1000, viscous: true,
    });
    const res = VLM.solve({ model: model,
      alphaMin: -20, alphaMax: 20, alphaStep: 0.5, viscous: true });
    LAST_RESULT = res; LAST_RESULT.fp = analysisFingerprint();
    LAST_MODEL = { model: model, fp: LAST_RESULT.fp, cache: {} };
    let warn = "";
    if(res.summary.missing_foils.length)
      warn = `<div class="hint">⚠ 抓不到翼型檔 <code>${res.summary.missing_foils.join("、")}</code>，
        先用平板中弧線近似——升力斜率對、但 α=0 的 CL 會偏低。</div>`;
    box.innerHTML = renderCharts(res) + warn;
    initFlowPanel();
  }catch(e){
    box.innerHTML = `<div class="chart" style="border-color:var(--bad)">
      <b style="color:var(--bad)">分析失敗</b><div class="cv">${String(e.message||e)}</div></div>`;
  }
}

/* flow5 對拍（選配）：有人架了分析服務才會出現這顆按鈕 */
async function doAnalyzeFlow5(){
  const box = $("#runResult");
  const i = inputs(), o = compute(i);
  const name = (state._fname || "design").replace(/[^\w-]/g, "_") || "plane";
  box.innerHTML = `<span class="spin"></span> 正在跑 flow5（約 10~60 秒）...`;
  const foils = [{name: i.foilData.name, dat: i.foilData.dat || ""},
                 {name: TAIL_FOIL.name, dat: TAIL_FOIL.dat || ""}];
  try{
    const res = await fetch(API_BASE + "/api/analyze", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        planeName: name,
        planeXml: buildFlow5Xml(i, o, name),
        velocity: i.v,
        refArea: o.S, refSpan: o.bproj, refChord: o.mac / 1000,
        viscous: false,
        alphaMin: -20, alphaMax: 20, alphaStep: 0.5,
        foils: foils,
      }),
    });
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    j.result.summary = j.result.summary || {};
    j.result.summary.method = "flow5";
    LAST_RESULT = j.result; LAST_RESULT.fp = analysisFingerprint();
    box.innerHTML = renderCharts(j.result);
  }catch(e){
    box.innerHTML = `<div class="chart" style="border-color:var(--bad)">
      <b style="color:var(--bad)">flow5 分析失敗</b><div class="cv">${String(e.message||e)}</div></div>`;
  }
}

function doGenXml(){
  const i=inputs(),o=compute(i);
  const name=(state._fname||"design").replace(/[\\/:*?"<>|]/g,"");
  dl(buildXflr5Xml(i,o,name), name+"_plane.xml", "application/xml");
  // 分開下載避免瀏覽器把第二個當快顯擋掉
  setTimeout(()=>dl(buildXflr5AnalysisXml(i,o,name), name+"_analysis.xml",
    "application/xml"), 400);
  const box=$("#xflr5Done"); if(box) box.classList.remove("hidden");
}
function doGenIni(){
  dl(buildXflr5IniSnippet(), "XFLR5_alpha_range.txt", "text/plain");
}
function doGenerate(){
  const i=inputs(),o=compute(i);
  const fname=(state._fname||"design").replace(/[\\/:*?"<>|]/g,"")+".xlsx";
  const bytes=buildXlsxBytes(i,o,fname);
  const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  URL.revokeObjectURL(a.href);
  const box=$("#afterGen"); box.classList.remove("hidden");
  const f=i.foilData;
  const foilSrc = f.url ? `<a href="${f.url}" target="_blank">airfoiltools</a>`
                        : `<a href="http://airfoiltools.com" target="_blank">airfoiltools 搜尋 ${f.name}</a>`;
  $("#datHint").innerHTML = f.dat===""
    ? `你的主翼翼型 <code>${f.name}</code> 是 NACA 四位數，<b>免下載</b>任何檔案。`
    : f.have
    ? `你的主翼翼型 <code>${f.name}</code> 的 <code>${f.dat}</code> repo 已附在 <code>wingforge/airfoils/</code>，不用動。`
    : `⚠ 你的主翼翼型 <code>${f.name}</code> 需要 .dat 檔：到 ${foilSrc} 頁面點 <b>Selig format dat file</b> 下載，存成 <code>wingforge/airfoils/${f.dat}</code> 再匯入（檔名要一字不差）。`;
  box.scrollIntoView({behavior:"smooth"});
}

/* ---------- 導覽 ---------- */
function render(){
  renderFlow();
  $("#stepbar").innerHTML=STEPS.map((s,i)=>
    `<button class="${i===state.step?"cur":i<state.step?"done":""}"
      onclick="go(${i})">${i<state.step?"✓ ":""}${s.title}</button>`).join("");
  $("#stepHost").innerHTML=STEPS[state.step].render();
  refreshLive();
  $("#btnPrev").style.visibility=state.step===0?"hidden":"visible";
  $("#btnNext").style.visibility=state.step===STEPS.length-1?"hidden":"visible";
  window.scrollTo({top:0});
}
function go(i){state.step=i;render()}
$("#btnPrev").onclick=()=>{if(state.step>0)go(state.step-1)};
$("#btnNext").onclick=()=>{if(state.step<STEPS.length-1)go(state.step+1)};
ensureVeeDefaults();
render();
// 開頁後在背景找分析服務，找到就把「分析」按鈕點亮（找不到不影響任何其他功能）
findServer().then(()=>refreshLive());
renderProjBar();
</script>
