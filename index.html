<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飛機設計填表精靈</title>
<style>
:root{
  --paper:#f3e9d2; --paper2:#ece0c3; --card:#faf4e4; --ink:#33302a;
  --ink2:#6b6353; --line:#d8c9a5; --accent:#b65c2e; --accent2:#8f4a26;
  --ok:#3f7d3f; --warn:#a8731d; --bad:#a83a2a; --blue:#3a5a78;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17.5px}
body{
  font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(rgba(182,92,46,.045) 1px, transparent 1.4px),
    linear-gradient(180deg,#f5ecd7 0%,#f0e4c8 100%);
  background-size:26px 26px,100% 100%;
  line-height:1.65;padding:1.2rem .9rem 4rem;
}
.wrap{max-width:46rem;margin:0 auto}
header.hero{
  border:2px solid var(--ink);border-radius:.6rem;background:var(--card);
  padding:1.1rem 1.2rem;margin-bottom:1.1rem;position:relative;overflow:hidden;
  box-shadow:.25rem .25rem 0 rgba(51,48,42,.18);
}
header.hero::after{
  content:"NYCU UAV";position:absolute;right:-.4rem;top:-.9rem;
  font:700 3.6rem/1 Consolas,monospace;color:rgba(182,92,46,.10);
  letter-spacing:-.05em;pointer-events:none;
}
h1{font-size:1.45rem;letter-spacing:.08em}
.sub{color:var(--ink2);font-size:.92rem;margin-top:.25rem}
/* 進度列 */
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.steps button{
  flex:1 1 auto;min-width:5.2rem;border:1.5px solid var(--ink);border-radius:.45rem;
  background:var(--card);padding:.35rem .4rem;font:inherit;font-size:.82rem;
  cursor:pointer;color:var(--ink2);transition:all .15s;
}
.steps button.cur{background:var(--accent);color:#fff;border-color:var(--accent2);
  box-shadow:.15rem .15rem 0 rgba(51,48,42,.25);transform:translateY(-1px)}
.steps button.done{color:var(--ok);border-color:var(--ok)}
/* 卡片 */
.card{
  background:var(--card);border:2px solid var(--ink);border-radius:.6rem;
  padding:1.1rem 1.2rem 1.3rem;margin-bottom:1rem;
  box-shadow:.25rem .25rem 0 rgba(51,48,42,.18);
}
.card h2{font-size:1.15rem;margin-bottom:.2rem;display:flex;align-items:baseline;gap:.5rem}
.card h2 .no{font:700 1rem Consolas,monospace;color:var(--accent);letter-spacing:.05em}
.lead{color:var(--ink2);font-size:.92rem;margin-bottom:.9rem}
/* 欄位 */
.field{margin-bottom:.9rem}
.field label{display:block;font-weight:700;font-size:.95rem;margin-bottom:.15rem}
.field .hint{font-size:.83rem;color:var(--ink2);margin-top:.2rem}
.field input[type=number],.field input[type=text],.field select{
  width:100%;max-width:14rem;font:inherit;font-size:1.05rem;padding:.35rem .55rem;
  border:1.5px solid var(--ink);border-radius:.4rem;background:#fffdf6;color:var(--ink);
}
.field input:focus,.field select:focus{outline:3px solid rgba(182,92,46,.35)}
.unit{font-size:.9rem;color:var(--ink2);margin-left:.35rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.2rem .9rem}
/* 徽章即時回饋 */
.badges{display:flex;flex-wrap:wrap;gap:.45rem;margin:.7rem 0 .2rem}
.badge{
  border:1.5px solid var(--line);border-radius:.45rem;background:#fffdf6;
  padding:.3rem .6rem;font-size:.85rem;box-shadow:.12rem .12rem 0 rgba(51,48,42,.08);
}
.badge b{font-family:Consolas,monospace;font-size:1rem}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
/* 機型卡 */
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem;margin:.4rem 0 .6rem}
.preset{
  border:2px solid var(--line);border-radius:.55rem;background:#fffdf6;padding:.7rem .8rem;
  cursor:pointer;transition:all .15s;
}
.preset:hover{transform:translateY(-2px)}
.preset.sel{border-color:var(--accent);background:#fdf3e4;box-shadow:.2rem .2rem 0 rgba(182,92,46,.3)}
.preset h3{font-size:1rem}
.preset p{font-size:.8rem;color:var(--ink2);margin-top:.2rem}
/* 翼型卡 */
.foilcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.6rem;margin:.4rem 0}
.foil{border:2px solid var(--line);border-radius:.55rem;background:#fffdf6;padding:.6rem .75rem;cursor:pointer}
.foil.sel{border-color:var(--blue);background:#eef2f6;box-shadow:.2rem .2rem 0 rgba(58,90,120,.3)}
.foil h4{font-size:.98rem;font-family:Consolas,monospace}
.foil p{font-size:.8rem;color:var(--ink2)}
.foil .tag{display:inline-block;font-size:.72rem;border:1px solid var(--ok);color:var(--ok);
  border-radius:.3rem;padding:0 .3rem;margin-top:.25rem}
.foil .tag.dl{border-color:var(--warn);color:var(--warn)}
details.teach{border:1.5px dashed var(--accent);border-radius:.5rem;padding:.6rem .8rem;margin:.7rem 0;background:#fdf6e9}
details.teach summary{cursor:pointer;font-weight:700;color:var(--accent2)}
details.teach ol{padding-left:1.3rem;margin-top:.4rem;font-size:.9rem}
details.teach li{margin-bottom:.3rem}
/* 導覽按鈕 */
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:.6rem}
.btn{
  font:inherit;font-weight:700;font-size:1.02rem;padding:.5rem 1.3rem;cursor:pointer;
  border:2px solid var(--ink);border-radius:.5rem;background:var(--card);color:var(--ink);
  box-shadow:.2rem .2rem 0 rgba(51,48,42,.25);transition:all .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px);box-shadow:.05rem .05rem 0 rgba(51,48,42,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#fff}
.btn.big{font-size:1.15rem;padding:.7rem 1.6rem;width:100%}
/* 總檢查表 */
table.check{width:100%;border-collapse:collapse;font-size:.9rem;margin:.5rem 0}
table.check td{border-bottom:1px solid var(--line);padding:.4rem .3rem;vertical-align:top}
table.check td:nth-child(2){font-family:Consolas,monospace;white-space:nowrap;text-align:right}
td.v-ok{color:var(--ok);font-weight:700}
td.v-warn{color:var(--warn);font-weight:700}
td.v-bad{color:var(--bad);font-weight:700}
.fusion-steps{border:2px solid var(--blue);border-radius:.55rem;background:#eef2f6;padding: .9rem 1rem;margin-top:1rem}
.fusion-steps h3{color:var(--blue);font-size:1.05rem}
.fusion-steps ol{padding-left:1.3rem;margin-top:.4rem;font-size:.92rem}
.fusion-steps li{margin-bottom:.35rem}
code{font-family:Consolas,monospace;background:#efe6cd;border-radius:.25rem;padding:0 .3rem;font-size:.88em}
.hidden{display:none}
@media (max-width:480px){ html{font-size:16.5px} .card{padding:.9rem .8rem 1rem} }
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>✈️ 飛機設計填表精靈</h1>
  <div class="sub">一步一步把你的飛機定出來 → 產生設計表 xlsx → 丟進 Fusion 360 一鍵長出機翼。
  每一步都有即時檢核，<b>綠色✓代表落在「好飛」的經驗區間</b>；出現⚠不是錯，是提醒你想清楚。</div>
</header>

<div class="steps" id="stepbar"></div>
<div id="stepHost"></div>

<div class="nav">
  <button class="btn" id="btnPrev">← 上一步</button>
  <button class="btn primary" id="btnNext">下一步 →</button>
</div>
</div>

<!-- ======================= 純邏輯區（node 可獨立測試，勿放 DOM 碼） ======================= -->
<script id="core-logic">
"use strict";
/* ---------- 航模翼型小百科（AIRFOILS 分頁資料源） ---------- */
const FOILS = [
 {name:"Clark Y", dat:"clarky.dat", have:true, cls:["trainer","park"],
  clmax:1.3, aoaStall:12, clCruise:0.8, aoaCruise:4,
  note:"平底經典練習翼型，好做好飛，repo 已附檔",
  url:"http://airfoiltools.com/airfoil/details?airfoil=clarky-il"},
 {name:"SD7037", dat:"sd7037.dat", have:true, cls:["glider","park"],
  clmax:1.25, aoaStall:11, clCruise:0.7, aoaCruise:4,
  note:"低雷諾數滑翔名翼型（Selig 設計），repo 已附檔",
  url:"http://airfoiltools.com/airfoil/details?airfoil=sd7037-il"},
 {name:"AG35", dat:"ag35.dat", have:true, cls:["glider"],
  clmax:1.2, aoaStall:10, clCruise:0.65, aoaCruise:3,
  note:"Drela 設計的滑翔翼型，薄而低阻，repo 已附檔",
  url:"http://airfoiltools.com/airfoil/details?airfoil=ag35-il"},
 {name:"NACA 2412", dat:"", have:true, cls:["sport","trainer"],
  clmax:1.25, aoaStall:13, clCruise:0.7, aoaCruise:4,
  note:"半對稱萬用翼型；NACA 四位數免下載（程式內建公式）",
  url:"http://airfoiltools.com/airfoil/details?airfoil=naca2412-il"},
 {name:"NACA 0012", dat:"", have:true, cls:["sport"],
  clmax:1.1, aoaStall:13, clCruise:0.5, aoaCruise:4,
  note:"對稱翼型，正倒飛一樣；特技取向。免下載",
  url:"http://airfoiltools.com/airfoil/details?airfoil=naca0012-il"},
 {name:"S1223", dat:"s1223.dat", have:false, cls:["lift"],
  clmax:1.85, aoaStall:10, clCruise:1.2, aoaCruise:5,
  note:"超高升力（載重挑戰用）；阻力大、需下載 .dat",
  url:"http://airfoiltools.com/airfoil/details?airfoil=s1223-il"},
];
const TAIL_FOIL = {name:"NACA 0008", dat:""};
// 翼型庫：正式來源是 repo 的 foils.json（GitHub 上人人可 PR 擴充）；
// 上面的 FOILS 只是 fetch 不到時的內建後備（file:// 開啟、離線）。
let LIB_FOILS = FOILS;
function setFoilLibrary(list){ if(Array.isArray(list)&&list.length) LIB_FOILS=list; }
function allFoils(custom){ return LIB_FOILS.concat(custom||[]); }

/* ---------- 機型預設 ---------- */
const PRESETS = {
 trainer:{label:"練習機", desc:"新生首選：慢、穩、摔得起",
  d:{mtow:700, v:12, chord:220, span:1200, taper:0.7, dihedral:5, washout:1,
     incidence:2, tegap:0, gap:60, foil:"Clark Y", noseC:1.25, tailC:2.5, xcg:0.35,
     shr:0.15, arh:4, th:0.6, svr:0.08, arv:1.5, tv:0.6, tailType:"cross",
     motorW:150, thrust:500}},
 park:{label:"公園慢速機", desc:"更輕更慢，小場地飛",
  d:{mtow:450, v:9, chord:200, span:1100, taper:0.8, dihedral:6, washout:1,
     incidence:2, tegap:0, gap:50, foil:"Clark Y", noseC:1.25, tailC:2.3, xcg:0.33,
     shr:0.18, arh:4, th:0.7, svr:0.09, arv:1.5, tv:0.6, tailType:"cross",
     motorW:100, thrust:350}},
 sport:{label:"運動機", desc:"會飛了之後的第二台",
  d:{mtow:1100, v:16, chord:240, span:1300, taper:0.65, dihedral:3, washout:1,
     incidence:1.5, tegap:0, gap:70, foil:"NACA 2412", noseC:1.3, tailC:2.6, xcg:0.33,
     shr:0.16, arh:4, th:0.6, svr:0.08, arv:1.6, tv:0.6, tailType:"cross",
     motorW:300, thrust:1000}},
 glider:{label:"電動滑翔機", desc:"追熱氣流、慢慢飄",
  d:{mtow:800, v:9, chord:180, span:2000, taper:0.6, dihedral:4, washout:1.5,
     incidence:2, tegap:0, gap:50, foil:"SD7037", noseC:1.2, tailC:2.8, xcg:0.36,
     shr:0.12, arh:4.5, th:0.6, svr:0.07, arv:1.6, tv:0.6, tailType:"vee",
     motorW:200, thrust:600}},
};

/* ---------- 全部公式（與 xlsx CALC 分頁同一套；SI 內部計算） ---------- */
function compute(i){
  const g=9.80665, rho=1.225, mu=1.81e-5;
  const W=i.mtow/1000, V=i.v, cr=i.chord, t=i.taper;
  const o={};
  o.ct = cr*t;
  o.mac = (2/3)*cr*(1+t+t*t)/(1+t);
  o.avg = cr*(1+t)/2;
  o.halfspan = (i.span - i.gap)/2;
  o.bproj = i.span/1000*Math.cos(i.dihedral*Math.PI/180);
  o.S = o.avg/1000*o.bproj;
  o.AR = o.bproj*o.bproj/o.S;
  o.wl = W/o.S*10;                                   // g/dm²
  o.wcl = (W*35.27396)/Math.pow(o.S*10.76391,1.5);
  o.clreq = W*g/(0.5*rho*V*V*o.S);
  const f = i.foilData;
  o.vs = Math.sqrt(2*W*g/(rho*o.S*f.clmax));
  o.vto = 1.2*o.vs; o.vapp = 1.3*o.vs;
  o.margin = V/o.vs;
  o.re = rho*V*(o.mac/1000)/mu;
  // ---- 尾翼幾何（依構型） ----
  const T = i.tailType || "cross";
  o.tailType = T;
  // 傳統參數（cross/tee/hh/box；也是切到 vee 時自動換算的來源）
  o.sh = i.shr*o.S; o.bh = Math.sqrt(i.arh*o.sh);
  o.chAvg = o.sh/o.bh*1000;
  o.chRoot = o.chAvg*2/(1+i.th); o.chTip = o.chRoot*i.th;
  o.sv = i.svr*o.S;
  o.finCount = (T==="hh"||T==="box") ? 2 : 1;
  const svEach = o.sv/o.finCount;
  o.bv = Math.sqrt(i.arv*svEach);                 // 單片 fin 高度 m
  o.cvAvg = svEach/o.bv*1000;
  o.cvRoot = o.cvAvg*2/(1+i.tv); o.cvTip = o.cvRoot*i.tv;
  if(T==="vee"){
    const th = (i.veeAngle||35)*Math.PI/180;
    o.veeCt = i.veeCr*i.veeTaper;
    const panel = (i.veeCr+o.veeCt)/2*i.veeL/1e6;  // 單片斜面積 m²
    o.veeArea = 2*panel;
    o.shEff = o.veeArea*Math.cos(th)*Math.cos(th); // cos² 有效面積（NACA R-823）
    o.svEff = o.veeArea*Math.sin(th)*Math.sin(th);
    o.veeSpanY = i.veeL*Math.cos(th);              // 站位展向（投影）
    o.tailAvgC = (i.veeCr+o.veeCt)/2;
    o.arhEff = Math.pow(2*i.veeL/1000,2)/o.veeArea; // 展開面 AR（給 XNP 式）
  } else {
    o.shEff = o.sh; o.svEff = o.sv;
    o.tailAvgC = o.chAvg; o.arhEff = i.arh;
  }
  // 力臂（重心→尾翼 1/4 弦；vee 用 V 尾自己的平均弦）
  o.lh = o.mac*(1-i.xcg) + i.tailC*o.mac - 0.75*(T==="vee"?o.tailAvgC:o.chAvg);
  o.lv = o.mac*(1-i.xcg) + i.tailC*o.mac - 0.75*(T==="vee"?o.tailAvgC:o.cvAvg);
  o.vh = o.shEff*(o.lh/1000)/(o.S*o.mac/1000);
  o.vv = o.svEff*(o.lv/1000)/(o.S*o.bproj);
  // 穩定性（xflr5 實測 XNP 優先；沒填用 MIT 公式估）
  o.xnpEst = 0.25 + (1+2/o.AR)/(1+2/o.arhEff)*(1-4/(o.AR+2))*o.vh;
  o.xnpFromXflr5 = i.xnpX>0;
  o.xnp = o.xnpFromXflr5 ? i.xnpX : o.xnpEst;
  o.sm = o.xnp - i.xcg;
  o.B = (o.lv/1000/o.bproj)*i.dihedral/o.clreq;
  o.vvb = o.vv*o.B;
  // 由傳統尾換算 vee 的建議值（切換構型時自動填入）
  o.veeSuggestAngle = Math.atan(Math.sqrt(o.sv/o.sh))*180/Math.PI;
  const veeAreaSug = (o.sh+o.sv)*1.075;
  o.veeSuggestL = Math.sqrt(veeAreaSug*i.arh)/2*1000;
  o.veeSuggestCr = (veeAreaSug/2)/(o.veeSuggestL/1000)*1000*2/(1+i.th);
  // 佈局位置（>0 的覆寫值優先，0=自動）
  o.noseLE = i.noseC*o.avg;
  o.totalLen = (i.noseC+i.tailC)*o.avg + cr;
  const autoHt = i.xcg*o.mac + o.lh - 0.25*(T==="vee"?o.tailAvgC:o.chAvg);
  const autoFin = i.xcg*o.mac + o.lv - 0.25*(T==="vee"?o.tailAvgC:o.cvAvg);
  o.htailLeX = (i.htailX>0) ? i.htailX : autoHt;
  o.finLeX = (i.finX>0) ? i.finX : autoFin;
  o.htailZ = (T==="tee") ? o.bv*1000 : 0;   // T 尾：平尾在 fin 頂
  o.finY = (T==="hh"||T==="box") ? o.bh*1000/2 : 0;   // 雙垂尾在平尾兩端
  o.boxTopZ = o.bv*1000;
  // 動力
  o.wkg = i.motorW>0 ? i.motorW/W : 0;
  o.tr = i.thrust>0 ? i.thrust/1000/W : 0;
  return o;
}

/* ---------- 檢核（回傳 [等級, 訊息]；等級 ok/warn/bad） ---------- */
function checks(i,o){
  const c=[];
  // 疑似打錯的輸入（單位/少打一個 0）——比紅燈更早點名病因
  const typo=[];
  if(i.chord<60) typo.push(`根弦 ${i.chord}mm 比麥克筆還窄（常見 150~300mm，是不是少打 0？）`);
  if(i.chord>700) typo.push(`根弦 ${i.chord}mm 快跟門一樣寬（是不是多打 0？）`);
  if(i.span<300) typo.push(`翼展 ${i.span}mm 只有一個手掌大`);
  if(i.span>0&&i.chord>0&&i.span<i.chord*1.5) typo.push("翼展比根弦還短——單位是不是填反了？");
  if(i.mtow<80) typo.push(`重量 ${i.mtow}g 比手機還輕（單位是公克）`);
  if(i.mtow>20000) typo.push(`重量 ${i.mtow}g 超過 20kg`);
  if(i.v<4||i.v>60) typo.push(`巡航速度 ${i.v} m/s 超出常理（單位是 m/s，不是 km/h）`);
  if(typo.length) c.push(["bad","輸入檢查","⚠", typo.join("；")]);
  const rng=(v,lo,hi,name,why)=> c.push(
    v>=lo&&v<=hi ? ["ok",name,fmt(v),"落在建議 "+lo+"~"+hi]
                 : ["warn",name,fmt(v),"建議 "+lo+"~"+hi+"："+why]);
  rng(o.AR,4.5,7.5,"展弦比","太低滑翔差、太高翼樑要夠強（滑翔機 8~25 另計）");
  const wclCat = o.wcl<3?"室內機":o.wcl<5?"後院機/電滑翔":o.wcl<7?"公園機/教練機"
    :o.wcl<10?"運動機":o.wcl<14?"進階運動/像真":o.wcl<17?"專家像真/EDF":"重型";
  c.push([o.wcl<10?"ok":"warn","WCL 立方翼載",fmt(o.wcl),"分級："+wclCat+"（新生建議 ≤7）"]);
  c.push([o.clreq<=i.foilData.clCruise?"ok":"bad","巡航需求 CL",fmt(o.clreq,3),
    o.clreq<=i.foilData.clCruise?"翼型巡航 CL "+i.foilData.clCruise+" 夠用"
    :"超過翼型巡航 CL "+i.foilData.clCruise+"——加大機翼、減重或飛快一點"]);
  c.push([o.margin>=1.3?"ok":"bad","巡航速度餘裕 V/Vs",fmt(o.margin),
    o.margin>=1.3?"離失速夠遠（≥1.3）":"太貼近失速速度！加大機翼或減重"]);
  c.push([o.re>=100000?"ok":o.re>=50000?"warn":"bad","巡航雷諾數",Math.round(o.re).toLocaleString(),
    o.re>=100000?"翼型正常工作區":o.re>=50000?"過渡帶：務必用低雷諾數翼型（SD7037 系）":"低於臨界帶（4~5萬）：翼弦太短或飛太慢，CLmax 會崩"]);
  if(o.lh<=30||o.lv<=30){
    c.push(["bad","尾力臂",fmt(Math.min(o.lh,o.lv),0)+" mm",
      "力臂太短甚至為負——「主翼後緣→尾翼後緣」距離太小、或尾翼弦太大，"
      +"回佈局那步把尾距加大"]);
  }
  rng(o.vh,0.30,0.60,"Vh 水平尾容積","太小俯仰飄、太大尾巴重"+
    (o.tailType==="vee"?"（V 尾以 cos² 有效面積換算）":""));
  rng(o.vv,0.02,0.05,"Vv 垂直尾容積","太小會擺尾（荷蘭滾）、太大盤旋不穩"+
    (o.tailType==="vee"?"（V 尾以 sin² 有效面積換算）":""));
  rng(o.sm,0.05,0.15,"靜穩定裕度 SM",
    (o.xnpFromXflr5?"（XNP 用 xflr5 實測值）":"（XNP 用公式估算，建議跑 xflr5 精算）")+
    "<0.05 神經質難飛；>0.20 遲鈍、抬頭配平重");
  c.push([o.B>=5?"ok":o.B>=3?"warn":"bad","B 螺旋穩定",fmt(o.B),
    o.B>=5?"放手自穩":o.B>=3?"副翼機可接受（3~5）":"螺旋不穩：加上反角"]);
  if(o.tailType!=="vee") c.push([o.vvb>=0.10&&o.vvb<=0.20?"ok":"warn","Vv·B 舵轉權威",fmt(o.vvb,3),
    "只對無副翼機重要；0.10 勉強、0.20 很有力"]);
  if(i.motorW>0){
    const p = o.wkg<110?["bad","恐飛不動（<50W/lb）"]:o.wkg<155?["ok","慢速/滑翔夠用"]
      :o.wkg<200?["ok","練習機級"]:o.wkg<245?["ok","運動機級"]:["ok","特技/3D 級"];
    c.push([p[0],"功率負載",Math.round(o.wkg)+" W/kg",p[1]]);
  }
  if(i.thrust>0){
    const p = o.tr<0.4?["bad","爬升吃力"]:o.tr<0.6?["warn","滑翔/慢速夠用"]
      :o.tr<0.8?["ok","教練/運動 OK"]:o.tr<1.1?["ok","很有勁"]:["ok","垂直性能級"];
    c.push([p[0],"靜推重比",fmt(o.tr),p[1]]);
  }
  return c;
}
function fmt(v,d){ return Number(v).toFixed(d===undefined?2:d); }

/* ---------- xlsx 產生（store-only zip；EXPORT 契約與 WingForge 解析器對齊） ---------- */
function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cellXml(ref,v){
  if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
}
function colName(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
function sheetXml(rows){
  // rows: array of array（null 跳格）
  let body="";
  rows.forEach((row,ri)=>{
    if(!row){return}
    let cellsX="";
    row.forEach((v,ci)=>{ if(v!==null&&v!==undefined) cellsX+=cellXml(colName(ci+1)+(ri+1),v); });
    if(cellsX) body+=`<row r="${ri+1}">${cellsX}</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
    `<sheetData>${body}</sheetData></worksheet>`;
}
function buildWorkbook(sheets){ // sheets: [{name, rows}]
  const files={};
  files["[Content_Types].xml"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
   `<Default Extension="xml" ContentType="application/xml"/>`+
   `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
   `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
   sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+
   `</Types>`;
  files["_rels/.rels"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
   `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  files["xl/workbook.xml"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" `+
   `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`+
   sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+
   `</sheets></workbook>`;
  files["xl/_rels/workbook.xml.rels"]=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
   `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
   sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+
   `</Relationships>`;
  sheets.forEach((s,i)=>{ files[`xl/worksheets/sheet${i+1}.xml`]=sheetXml(s.rows); });
  return files;
}
/* store-only zip */
const _CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  const names=Object.keys(files);
  for(const name of names){
    const data=enc.encode(files[name]); const nameB=enc.encode(name);
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    off+=30+nameB.length+data.length;
  }
  let cdSize=0; central.forEach(p=>cdSize+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,names.length,true);eo.setUint16(10,names.length,true);
  eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  const total=off+cdSize+22;const out=new Uint8Array(total);let p=0;
  for(const part of [...parts,...central,new Uint8Array(eo.buffer)]){out.set(part,p);p+=part.length}
  return out;
}

/* ---------- 由輸入組出整本 xlsx（EXPORT 契約） ---------- */
function buildXlsxBytes(i,o,fileName){
  const T = i.tailType || "cross";
  const HDR = ["idx","span_mm","chord_mm","twist_deg","sweep_mm","dihedral_deg"];
  const exportRows=[

    ["wing.airfoil",i.foilData.name],
    ["wing.mirror","TRUE"],
    ["wing.te_gap_mm",i.tegap],
    ["wing.center_gap_mm",i.gap],
    ["wing.twist_pivot",0.25],
    ["wing.smooth","FALSE"],
    ["wing.tip_round","FALSE"],
    ["tail.type",T],
    ["tail.airfoil",TAIL_FOIL.name],
  ];
  if(T==="vee"){
    exportRows.push(["vee.le_x_mm",o.htailLeX]);
  }else{
    exportRows.push(
      ["htail.le_x_mm",o.htailLeX],["htail.z_mm",o.htailZ],
      ["fin.count",o.finCount],["fin.le_x_mm",o.finLeX],
      ["fin.y_mm",o.finY],["fin.z_mm",0]);
    if(T==="box") exportRows.push(
      ["boxtop.le_x_mm",o.finLeX+0.25*(o.cvRoot-o.cvTip)],
      ["boxtop.z_mm",o.boxTopZ]);
  }
  exportRows.push(null,["STATIONS_MAIN"],HDR,
    [0,0,i.chord,i.incidence,0,0],
    [1,o.halfspan,o.ct,i.incidence-i.washout,0.25*(i.chord-o.ct),i.dihedral]);
  if(T==="vee"){
    exportRows.push(null,["STATIONS_VEE"],HDR,
      [0,0,i.veeCr,0,0,0],
      [1,o.veeSpanY,o.veeCt,0,0.25*(i.veeCr-o.veeCt),i.veeAngle]);
  }else{
    exportRows.push(null,["STATIONS_HTAIL"],HDR,
      [0,0,o.chRoot,0,0,0],
      [1,o.bh*1000/2,o.chTip,0,0.25*(o.chRoot-o.chTip),0]);
    exportRows.push(null,["STATIONS_FIN"],HDR,
      [0,0,o.cvRoot,0,0,0],
      [1,o.bv*1000,o.cvTip,0,0.25*(o.cvRoot-o.cvTip),0]);
    if(T==="box") exportRows.push(null,["STATIONS_BOXTOP"],HDR,
      [0,0,o.cvTip,0,0,0],
      [1,o.bh*1000/2,o.cvTip,0,0,0]);
  }
  const airfoilRows=[
    ["翼型庫對照（.dat 放 wingforge/airfoils/）"],
    ["翼型名稱","dat 檔名","來源連結","備註"],
    ...allFoils(i.customFoils).map(f=>[f.name,f.dat,f.url||"",f.note||""]),
    [TAIL_FOIL.name,"","","尾翼用；NACA 四位數免 dat"],
  ];
  const inputRows=[
    ["填表精靈輸入紀錄（值）"],["項目","值","單位"],
    ["機型",PRESETS[i.preset].label,""],["最大起飛重量",i.mtow,"g"],
    ["巡航速度",i.v,"m/s"],["根弦長",i.chord,"mm"],["翼展",i.span,"mm"],
    ["漸縮比",i.taper,""],["上反角",i.dihedral,"deg"],["洗出",i.washout,"deg"],
    ["裝置角",i.incidence,"deg"],["後緣厚度",i.tegap,"mm"],["機身寬",i.gap,"mm"],
    ["主翼翼型",i.foilData.name,""],["CLmax",i.foilData.clmax,""],
    ["巡航CL",i.foilData.clCruise,""],
    ["機頭距離",i.noseC,"chord"],["尾翼距離",i.tailC,"chord"],["重心位置",i.xcg,"MAC比"],
    ["平尾面積比",i.shr,""],["平尾AR",i.arh,""],["垂尾面積比",i.svr,""],
    ["垂尾AR",i.arv,""],["尾翼構型",i.tailType,""],
    ["XNP(xflr5實測,0=未跑)",i.xnpX,"MAC比"],
    ["馬達功率",i.motorW,"W"],["靜推力",i.thrust,"g"],
  ];
  const calcRows=[["計算結果紀錄（值）"],["項目","值","判定"],
    ...checks(i,o).map(c=>[c[1],c[2],(c[0]==="ok"?"✓ ":"⚠ ")+c[3]])];
  const files=buildWorkbook([
    {name:"EXPORT",rows:exportRows},
    {name:"AIRFOILS",rows:airfoilRows},

  return makeZip(files);
}
/* ---------- xflr5 飛機定義 XML（Plane > Import Plane(s) from xml file(s)） ---------- */
function buildXflr5Xml(i,o,name){
  const T=i.tailType||"cross";
  const E=xmlEsc, M=v=>(v/1000).toFixed(6);   // mm→m
  const sec=(y,chord,xoff,dihe,twist,foil)=>`
    <Section>
     <y_position>${M(y)}</y_position>
     <Chord>${M(chord)}</Chord>
     <xOffset>${M(xoff)}</xOffset>
     <Dihedral>${dihe.toFixed(2)}</Dihedral>
     <Twist>${twist.toFixed(2)}</Twist>
     <x_number_of_panels>13</x_number_of_panels>
     <x_panel_distribution>COSINE</x_panel_distribution>
     <y_number_of_panels>19</y_number_of_panels>
     <y_panel_distribution>UNIFORM</y_panel_distribution>
     <Left_Side_FoilName>${E(foil)}</Left_Side_FoilName>
     <Right_Side_FoilName>${E(foil)}</Right_Side_FoilName>
    </Section>`;
  const wing=(wname,type,pos,isFin,sections)=>`
   <wing>
    <Name>${E(wname)}</Name>
    <Type>${type}</Type>
    <Position>${pos.map(v=>(v/1000).toFixed(6)).join(", ")}</Position>
    <Tilt_angle>0.000</Tilt_angle>
    <Symetric>${isFin?"false":"true"}</Symetric>
    <isFin>${isFin?"true":"false"}</isFin>
    <isDoubleFin>false</isDoubleFin>
    <isSymFin>false</isSymFin>
    <Inertia><Volume_Mass>0.000</Volume_Mass></Inertia>
    <Sections>${sections}</Sections>
   </wing>`;
  const foil=i.foilData.name;
  // 主翼：2 站位；xflr5 的 Dihedral 是「本段」屬性→掛在起始剖面，
  // 末剖面的 Dihedral 被忽略（官方 wing.cpp 語意），慣例填 0。
  // 展向用 span/2（自中線起算的完整梯形）而非扣機身的翼段半展——
  // VLM 慣例把機身段升力視為連續，這也是精靈算 S/AR/Vh 的口徑，
  // 兩邊一致 xflr5 才是在驗證「同一台飛機」。
  const mainSecs =
    sec(0, i.chord, 0, i.dihedral, i.incidence, foil)+
    sec(i.span/2, o.ct, 0.25*(i.chord-o.ct), 0, i.incidence-i.washout, foil);
  let tailWings="";
  if(T==="vee"){
    tailWings = wing("V-Tail","ELEVATOR",[o.htailLeX,0,0],false,
      sec(0, i.veeCr, 0, i.veeAngle, 0, TAIL_FOIL.name)+
      sec(o.veeSpanY, o.veeCt, 0.25*(i.veeCr-o.veeCt), 0, 0, TAIL_FOIL.name));
  }else{
    tailWings = wing("Elevator","ELEVATOR",[o.htailLeX,0,o.htailZ],false,
      sec(0, o.chRoot, 0, 0, 0, TAIL_FOIL.name)+
      sec(o.bh*1000/2, o.chTip, 0.25*(o.chRoot-o.chTip), 0, 0, TAIL_FOIL.name));
    // hh/box 在 xflr5 以「等效單垂尾」近似：兩片各 Sv/2、同弦長 →
    // 高度加倍即得總面積 Sv 的單片（Vv 等效，橫航向穩定性量級一致）。
    tailWings += wing("Fin","FIN",[o.finLeX,0,0],true,
      sec(0, o.cvRoot, 0, 0, 0, TAIL_FOIL.name)+
      sec(o.bv*1000*((T==="hh"||T==="box")?2:1), o.cvTip,
          0.25*(o.cvRoot-o.cvTip), 0, 0, TAIL_FOIL.name));
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE explane>
<explane version="1.0">
 <Units>
  <length_unit_to_meter>1</length_unit_to_meter>
  <mass_unit_to_kg>1</mass_unit_to_kg>
 </Units>
 <Plane>
  <Name>${E(name)}</Name>
  <Description>由 NYCU UAV 填表精靈產生</Description>
  <Inertia>
   <Point_Mass>
    <Tag>全機質量</Tag>
    <Mass>${(i.mtow/1000).toFixed(4)}</Mass>
    <coordinates>${(i.xcg*o.mac/1000).toFixed(6)}, 0, 0</coordinates>
   </Point_Mass>
  </Inertia>
  <has_body>false</has_body>${wing("Main Wing","MAINWING",[0,0,0],false,mainSecs)}${tailWings}
 </Plane>
</explane>
`;
}

function addFoil(){
  const name=($("#nf_name").value||"").trim();
  let dat=($("#nf_dat").value||"").trim();
  const clmax=parseFloat($("#nf_clmax").value), clc=parseFloat($("#nf_clc").value);
  if(!name){alert("翼型名稱必填");return}
  if(allFoils(state.customFoils).some(f=>f.name===name)){alert("這個名稱已存在");return}
  const isNaca=/^NACA\s*\d{4}$/i.test(name);
  const srcUrl=state._nfUrl||"";
  if(!isNaca && !dat && !srcUrl){
    alert("請三選一：貼 airfoiltools 網址、選 .dat 檔、或用 NACA 四位數命名");return}
  if(isNaca) dat="";
  const nf={name, dat, have:false, custom:true, cls:[], url:srcUrl,
    clmax:clmax||1.2, clCruise:clc||0.7,
    note:"自訂翼型"+(isNaca?"（NACA 內建公式）":
      srcUrl?"（機器人/Fusion 會自動下載）":`（需把 ${dat} 放進 airfoils/）`)};

  const meta={name:nf.name, dat:nf.dat, clmax:nf.clmax, clCruise:nf.clCruise};
  if(nf.url) meta.url=nf.url;
  const datText=(state._nfDatText||"").trim();
  const mkBody=(datPart)=>
    "送出這個 Issue 就完成上傳——機器人會自動驗證並 commit 進社團翼型庫，"+
    "不用會 git、不用任何權限。\n\n## metadata（勿改格式）\n```json\n"+
    JSON.stringify(meta,null,1)+"\n```\n\n## dat 座標內容\n"+datPart;
  const mkUrl=(body)=>"https://github.com/NYCU-UAV/UAV_designsystem_web/issues/new"+
      "?title="+encodeURIComponent("[翼型] "+nf.name)+
      "&body="+encodeURIComponent(body);
  let embedded=false, issueUrl;
  if(!nf.dat){
    issueUrl=mkUrl(mkBody("（NACA 四位數免附檔，直接送出即可）")); embedded=true;
  }else if(nf.url && !datText){
    // 只給網址：機器人會自己去 airfoiltools 抓座標，使用者什麼都不用貼
    issueUrl=mkUrl(mkBody("（已提供 airfoiltools 網址，機器人會自動下載座標，直接送出即可）"));
    embedded=true;
  }else if(datText){
    issueUrl=mkUrl(mkBody("```dat\n"+datText+"\n```"));
    embedded = issueUrl.length<=7000;     // GitHub/伺服器 URL 上限保險值
    if(!embedded) issueUrl=mkUrl(mkBody(
      "👉 按分享框的「複製座標內容」，貼到下面兩個 ``` 之間（取代提示文字）：\n"+
      "```dat\n（把 .dat 內容貼在這裡）\n```"));
  }else{
    issueUrl=mkUrl(mkBody(
      "👉 用記事本打開你的 `"+nf.dat+"`，**全選複製**，貼到下面兩個 ``` 之間"+
      "（取代提示文字）：\n```dat\n（把 .dat 內容貼在這裡）\n```"));
  }
  state._shareFoil={name:nf.name, issueUrl, embedded,
    datText:(!embedded&&datText)?datText:null};
  state._nfDatText=null; state._nfUrl=null;
  state.foil=name; state.clmax=clmax||1.2; state.clcruise=clc||0.7;

function parseFoilUrl(url){
  const msg=$("#nf_urlmsg");
  const m=(url||"").match(/airfoiltools\.com.*?airfoil=([\w.-]+)/i);
  if(!m){
    state._nfUrl=null;
    if((url||"").trim()) msg.innerHTML="⚠ 認不出來——網址要像 "+
      "<code>airfoiltools.com/airfoil/details?airfoil=<b>oa206-il</b></code>";
    return;
  }
  const id=m[1];
  state._nfUrl="http://airfoiltools.com/airfoil/details?airfoil="+id;
  if(!$("#nf_dat").value) $("#nf_dat").value=id.replace(/-il$/,"")+".dat";
  if(!$("#nf_name").value) $("#nf_name").value=id.replace(/-il$/,"").toUpperCase();
  msg.innerHTML="✅ 認出翼型代號 <code>"+id+"</code>——免下載，上傳時機器人會自動抓座標"+
    "（正式名稱也會依 .dat 檔頭校正）";
}
function readFoilFile(inp){
  const f=inp.files&&inp.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ state._nfDatText=r.result;
    const guess=f.name.toLowerCase().endsWith(".dat")?f.name.toLowerCase():f.name.toLowerCase()+".dat";
    if(!$("#nf_dat").value) $("#nf_dat").value=guess.replace(/[^\w.-]/g,"");
    // 檔頭常是翼型名稱，順手帶入名稱欄
    if(!$("#nf_name").value){
      const first=(r.result.split("\n")[0]||"").trim();
      if(first && !/^[-\d.\s]+$/.test(first)) $("#nf_name").value=first.slice(0,30);
    }
  };
  r.readAsText(f);
}
function delFoil(name){

    (T==="box"?`<div class="hint">◻ 上封板＝垂尾頂端一片矩形板（弦＝垂尾梢弦），只算結構。</div>`:"");
  }
  return `<div class="card"><h2><span class="no">STEP 6</span>尾翼</h2>
  <div class="lead">先選構型，再填該構型需要的參數。目標：<b>Vh 0.30~0.60、Vv 0.02~0.05</b> 綠燈。</div>
  ${cards}${fields}
  <div data-live='["尾力臂","Vh 水平尾容積","Vv 垂直尾容積","B 螺旋穩定","Vv·B 舵轉權威"]'></div></div>`;
}
function rPower(){
  return `<div class="card"><h2><span class="no">STEP 7</span>動力（選填）</h2>
  <div class="lead">還沒選馬達可以先填 0 跳過；有數字就能驗證「飛得動、爬得上去」。</div>
  <div class="grid2">
  ${field("motorW","馬達全油門功率","W","看馬達規格表或瓦特計實測")}
  ${field("thrust","動力組靜推力","g","馬達+槳的靜推力；廠標或用廚房秤實測")}
  </div>
  <div data-live='["功率負載","靜推重比"]'></div></div>`;
}
function rXflr5(){
  const i=inputs(),o=compute(i);
  const reTxt=Math.round(o.re).toLocaleString();
  const xcgMM=(i.xcg*o.mac).toFixed(0);
  const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const foilName=i.foilData.name;
  return `<div class="card"><h2><span class="no">STEP 8</span>xflr5 驗證（強烈建議）</h2>
  <div class="lead">精靈的中性點（XNP）與穩定裕度是<b>公式初估</b>；xflr5 用你的實際幾何免費精算。
  跑完把 XNP 填回下面欄位，總檢查會自動改用實測值。沒空跑也能直接產表，但首飛前跑一輪最保險。</div>
  <div class="badges">
    <span class="badge">分析雷諾數 <b>${reTxt}</b></span>
    <span class="badge">巡航速度 <b>${i.v} m/s</b></span>
    <span class="badge">全備重 <b>${i.mtow} g</b></span>
    <span class="badge">重心 <b>距主翼前緣 ${xcgMM} mm</b>（${i.xcg}×MAC）</span>
    <span class="badge">目前 XNP 估算 <b>${o.xnpEst.toFixed(3)}c</b></span>
  </div>
  <details class="teach" open><summary>📚 xflr5 六步流程（照抄就能跑）</summary>
    <ol>
      <li><b>安裝</b>：<a href="https://www.xflr5.tech" target="_blank">xflr5.tech</a> 免費下載。</li>
      <li><b>翼型極線</b>：File &gt; Direct Foil Analysis → 載入主翼/尾翼翼型（.dat 或 NACA 產生器）→
        Analysis &gt; Batch Analysis，Re 範圍抓 <code>50,000 ~ 300,000</code>（要涵蓋你的 ${reTxt}）。
        <br><span style="color:var(--ink2)">「極線」＝翼型的成績單：在某個雷諾數下把攻角從小掃到大，
        記錄每個攻角的升力係數 Cl、阻力係數 Cd、力矩係數 Cm。之後 xflr5 算整機，就是拿這些
        成績單去組合——所以雷諾數範圍一定要涵蓋你實際飛的 Re，否則等於拿別人的成績單抄。</span></li>
      <li><b>匯入全機（免手畫）</b>：按
        <button class="btn" style="font-size:.85rem;padding:.15rem .7rem" onclick="doGenXml()">⬇ 下載 xflr5 飛機檔 (.xml)</button>
        → xflr5 的 File &gt; Wing and Plane Design → <b>Plane &gt; Import Plane(s) from xml file(s)</b>
        選這個檔——主翼/尾翼幾何、位置、重量重心（${i.mtow} g @ 距主翼前緣 ${xcgMM} mm）全部自動帶入。
        <br><span style="color:var(--ink2)">⚠ 翼型名稱必須<b>一字不差（含大小寫與空格）</b>：xflr5 匯入時
        不會檢查也不會報錯，找不到同名翼型會靜默變成平板、分析結果全錯。
        本檔用的名稱是 <code>${E(foilName)}</code> 與 <code>${E(TAIL_FOIL.name)}</code>——
        先在第 2 步把這兩個翼型載進 Direct Foil Design（.dat 檔頭第一行就是 xflr5 認的名稱，
        必要時在 xflr5 裡改名對齊）。想手畫也可以，尺寸在各步、位置在「機身佈局」的 📍。</span></li>
      <li><b>跑分析</b>：Define an Analysis（Type 1 固定速度 ${i.v} m/s）→ α 掃 <code>−20° ~ 20°</code>
        （失速角之後的區段 xflr5 不準，參考就好）。<b>四張圖照這個順序看</b>：
        <ol style="margin:.2rem 0 .2rem 1rem">
          <li><b>Cm vs Cl</b>——先確認「自穩定」：斜率為負（升力越大越低頭）才會自己回穩。
            這關不過，後面看什麼都沒意義——回精靈調重心/尾翼。</li>
          <li><b>Cl vs α</b>——確認「會飛」：α=0 時 Cl 要 &gt;0，並看清楚失速在幾度。</li>
          <li><b>Cm vs α</b>——找「配平點」：Cm=0 的過零攻角＝飛機放手後自己想飛的攻角。</li>
          <li><b>Cl/Cd vs α</b>——檢查「效率」：升阻比峰值應落在上一步的配平攻角附近；
            差太遠＝飛機停在效率差的攻角上，回精靈調裝置角（見下面迭代清單）。</li>
        </ol>
        口訣：<b>先穩（1）、再會飛（2）、找到它想停的攻角（3）、確認停得漂亮（4）。</b></li>
      <li><b>讀 XNP</b>：跑 Stability analysis（Type 7），或看 Polar 資料裡的 Neutral Point——
        換算成「距主翼前緣的弦長比」填回下面。</li>
    </ol></details>
  <details class="teach"><summary>🔁 看完 xflr5 要回來「迭代」哪些參數（重要！）</summary>
    <ol>
      <li><b>XNP 讀到了</b> → 填進下面的欄位（弦長比），SM 自動改用實測值。</li>
      <li><b>Cm vs α 的過零點不在巡航攻角附近</b>（例：巡航該在 4° 但 Cm=0 落在 8°）→
        回 <a href="javascript:go(2)">主翼</a> 步調 <b>裝置角</b>：過零攻角太大→裝置角加大、太小→減小，
        一次動 0.5° 慢慢逼近。</li>
      <li><b>SM 太大/太小</b> → 回 <a href="javascript:go(4)">機身佈局</a> 步<b>先動重心位置</b>
        （每 0.01 動一格），不要急著改尾翼大小。</li>
      <li><b>α=0 時 Cl≤0</b>（平飛要抬很大機頭）→ 裝置角太小或翼型太對稱，
        回 <a href="javascript:go(2)">主翼</a>／<a href="javascript:go(3)">翼型</a> 步。</li>
      <li><b>Cl/Cd 峰值攻角離巡航攻角很遠</b> → 回 <a href="javascript:go(1)">重量速度</a> 步調巡航速度，
        或換翼型。</li>
      <li><b>在 xflr5 挪過尾翼位置</b> → 把最終位置抄回 <a href="javascript:go(4)">機身佈局</a> 步的
        <b>位置覆寫欄</b>，讓 Fusion 生成的機跟 xflr5 驗證的是同一台。</li>
      <li>每改完一輪 → 重跑 xflr5 確認 → 到 <a href="javascript:go(8)">總檢查</a> 重新產 xlsx →
        Fusion 重新匯入（或對既有特徵 Edit Wing 改參數）。通常 2~3 輪就收斂。</li>
    </ol></details>
  <div class="grid2">
  ${field("xnpX","xflr5 實測 XNP（弦長比；0＝還沒跑）","","例：XNP 在 43% MAC 就填 0.43；填入後 SM 檢核自動改用實測值","step=0.005")}
  </div>
  <div data-live='["靜穩定裕度 SM"]'></div>
  <div class="hint">⚠ xflr5 已知限制（引用官方文件）：總阻力普遍低估約 20%、CLmax 偏高、
  <b>不要建機身</b>（官方原話：對分析是幫倒忙，只建翼＋尾即可）、完全沒有螺旋槳效應——
  手擲滑翔配平準、開動力後配平跑掉是正常現象，不要回頭亂改模型。</div></div>`;
}
function rFinal(){
  const today=new Date();
  const d=today.getFullYear()+String(today.getMonth()+1).padStart(2,"0")+String(today.getDate()).padStart(2,"0");
  if(!state._fname) state._fname=d+"_我的"+PRESETS[state.preset].label;
  return `<div class="card"><h2><span class="no">STEP 9</span>總檢查 → 產生設計表</h2>
  <div class="lead">全部綠燈最理想；⚠ 黃字代表「可以飛，但要知道自己在取捨什麼」。</div>
  <div id="finalTable"></div>
  <div class="field" style="margin-top:.8rem"><label>檔案名稱</label>
    <input type="text" id="f_fname" value="${state._fname}" style="max-width:20rem"
      oninput="state._fname=this.value"><span class="unit">.xlsx</span></div>
  <button class="btn primary big" onclick="doGenerate()">📄 產生 xlsx 設計表</button>
  <div id="afterGen" class="fusion-steps hidden">
    <h3>🛩️ 接下來：去 Fusion 360 長出飛機</h3>
    <ol>
      <li>把剛下載的 <code>.xlsx</code> 放到任何位置（建議放專案資料夾）。</li>
      <li>開 Fusion 360 → 工具列 <b>公用程式 &gt; Scripts and Add-Ins</b> → WingForge <b>Run</b>（已在跑就 Stop→Run 一次）。</li>
      <li><b>實體 &gt; 建立 &gt; 從表格生成</b> → 選你的 xlsx → 看預覽 → 確定。</li>
      <li>主翼＋水平尾就長出來了，每支都能用 <b>修改 &gt; Edit Wing</b> 再調（先點選特徵）。</li>
      <li id="datHint"></li>
      <li>五種尾翼構型（十字／T／V／H／口字）全部自動生成，整台機一次到位。</li>
    </ol>
  </div></div>`;
}
function renderFinalTable(){
  const i=inputs(),o=compute(i),cs=checks(i,o);
  $("#finalTable").innerHTML=`<table class="check">`+cs.map(c=>
    `<tr><td>${c[1]}</td><td class="v-${c[0]}">${c[2]}</td><td class="v-${c[0]}">${c[0]==="ok"?"✓":"⚠"}</td><td>${c[3]}</td></tr>`).join("")+`</table>`;
}
function doGenXml(){
  const i=inputs(),o=compute(i);
  const name=(state._fname||"design").replace(/[\\/:*?"<>|]/g,"");
  const xml=buildXflr5Xml(i,o,name);
  const blob=new Blob([xml],{type:"application/xml"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name+"_xflr5.xml"; a.click();
  URL.revokeObjectURL(a.href);
}
function doGenerate(){
  const i=inputs(),o=compute(i);
  const fname=(state._fname||"design").replace(/[\\/:*?"<>|]/g,"")+".xlsx";
  const bytes=buildXlsxBytes(i,o,fname);
  const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  URL.revokeObjectURL(a.href);
  const box=$("#afterGen"); box.classList.remove("hidden");
  const f=i.foilData;
  const foilSrc = f.url ? `<a href="${f.url}" target="_blank">airfoiltools</a>`
                        : `<a href="http://airfoiltools.com" target="_blank">airfoiltools 搜尋 ${f.name}</a>`;
  $("#datHint").innerHTML = f.dat===""
    ? `你的主翼翼型 <code>${f.name}</code> 是 NACA 四位數，<b>免下載</b>任何檔案。`
    : f.have
    ? `你的主翼翼型 <code>${f.name}</code> 的 <code>${f.dat}</code> repo 已附在 <code>wingforge/airfoils/</code>，不用動。`
    : `⚠ 你的主翼翼型 <code>${f.name}</code> 需要 .dat 檔：到 ${foilSrc} 頁面點 <b>Selig format dat file</b> 下載，存成 <code>wingforge/airfoils/${f.dat}</code> 再匯入（檔名要一字不差）。`;
  box.scrollIntoView({behavior:"smooth"});
}

/* ---------- 導覽 ---------- */
function render(){
  $("#stepbar").innerHTML=STEPS.map((s,i)=>
    `<button class="${i===state.step?"cur":i<state.step?"done":""}"
      onclick="go(${i})">${i<state.step?"✓ ":""}${s.title}</button>`).join("");
  $("#stepHost").innerHTML=STEPS[state.step].render();
  refreshLive();
  $("#btnPrev").style.visibility=state.step===0?"hidden":"visible";
  $("#btnNext").style.visibility=state.step===STEPS.length-1?"hidden":"visible";
  window.scrollTo({top:0});
}
function go(i){state.step=i;render()}
$("#btnPrev").onclick=()=>{if(state.step>0)go(state.step-1)};
$("#btnNext").onclick=()=>{if(state.step<STEPS.length-1)go(state.step+1)};
ensureVeeDefaults();
render();
</script>
</body>
</html>
